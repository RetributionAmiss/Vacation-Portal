name: Apps Script HTTP Diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-webapp-response:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe configured Apps Script web app
        shell: bash
        run: |
          set -euo pipefail
          portal_url="$(node - <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('config.js', 'utf8');
          const match = config.match(/portalUrl:\s*'([^']+)'/);
          if (!match) throw new Error('portalUrl not found');
          process.stdout.write(match[1]);
          NODE
          )"

          headers="$(mktemp)"
          body="$(mktemp)"
          meta="$(curl -L -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}|%{url_effective}|%{content_type}|%{size_download}' "${portal_url}?deploymentDiagnostic=1")"

          echo "HTTP metadata: $meta"
          echo "Body SHA256: $(sha256sum "$body" | awk '{print $1}')"
          echo "Body bytes: $(wc -c < "$body")"
          echo "Detected markers:"
          for marker in \
            'Family Vacation Portal' \
            'Smoky Mountain Vacation' \
            'loadingScreen' \
            'Opening the family portal' \
            'Sorry, unable to open the file at this time' \
            'Authorization is required' \
            'Script function not found' \
            'ServiceLogin' \
            'Google Drive'; do
            if grep -Fq "$marker" "$body"; then
              echo "  FOUND: $marker"
            else
              echo "  absent: $marker"
            fi
          done

          echo "HTML title:"
          grep -oim1 '<title[^>]*>[^<]*</title>' "$body" || true

          echo "First 1200 normalized characters:"
          tr '\n\r\t' '   ' < "$body" | sed -E 's/[[:space:]]+/ /g' | cut -c1-1200

          rm -f "$headers" "$body"
