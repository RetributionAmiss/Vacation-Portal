name: Apps Script Preview Verification

on:
  push:
    branches:
      - test/supabase-itinerary-primary-write-preview

permissions:
  contents: read

jobs:
  verify-preview:
    name: Verify Apps Script preview
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      PREVIEW_DEPLOYMENT_ID: AKfycby_FG5Bdl9Vt8stKlx-ywfr8QlhXDB4xaKv7upBw-dKRP_C9nLs1FEeOfNOvoQbgmgWRg
      PRODUCTION_DEPLOYMENT_ID: AKfycbzfo6ZXGGxQFApb6h0XTUmTKdeCLtSvTjoGXR1mKIuv1laEjZnREhHyJ01wguFfRxWOpA
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure clasp authentication
        shell: bash
        run: |
          if [[ -z "$APPS_SCRIPT_ID" || -z "$CLASPRC_JSON" ]]; then
            echo "::error::Apps Script verification credentials are not configured."
            exit 1
          fi
          if [[ "$PREVIEW_DEPLOYMENT_ID" == "$PRODUCTION_DEPLOYMENT_ID" ]]; then
            echo "::error::Preview and production deployment IDs must differ."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('.clasp.json', JSON.stringify({
            scriptId: process.env.APPS_SCRIPT_ID,
            rootDir: '.'
          }, null, 2) + '\n');
          NODE

      - name: Verify alpha2.22 static preview configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('config.js', 'utf8');
          const previewId = process.env.PREVIEW_DEPLOYMENT_ID;
          const productionId = process.env.PRODUCTION_DEPLOYMENT_ID;
          if (!config.includes(`https://script.google.com/macros/s/${previewId}/exec`)) throw new Error('Preview config does not use the isolated backend.');
          if (config.includes(`https://script.google.com/macros/s/${productionId}/exec`)) throw new Error('Preview config points at production.');
          if (!config.includes("release: 'V4.4.0-alpha2.22'")) throw new Error('Preview release is not alpha2.22.');
          if (!config.includes('supabase-itinerary-comment-bridge.js')) throw new Error('Comment host bridge is missing.');
          NODE

      - name: Wait for deployment metadata to show preview @202
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            deployments="$(npx --yes @google/clasp@3.4.0 deployments)"
            if grep -Fq "$PREVIEW_DEPLOYMENT_ID @202" <<<"$deployments" && \
               grep -Fq "$PRODUCTION_DEPLOYMENT_ID @199" <<<"$deployments"; then
              echo "$deployments"
              echo "Verified preview @202 and production @199."
              exit 0
            fi
            echo "Deployment metadata has not converged yet (${attempt}/12)."
            sleep 5
          done
          echo "$deployments"
          echo "::error::Could not verify preview @202 with production still @199."
          exit 1

      - name: Smoke test alpha2.22 preview web app
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://script.google.com/macros/s/${PREVIEW_DEPLOYMENT_ID}/exec"
          smoke_url="${preview_url}?deploymentSmoke=${GITHUB_SHA}"
          for attempt in $(seq 1 12); do
            body_file="$(mktemp)"
            curl -L -sS --max-time 20 -o "$body_file" "$smoke_url" || true
            if grep -Fq 'Family Vacation Portal' "$body_file" && \
               grep -Fq 'loadingScreen' "$body_file" && \
               grep -Fq 'deleteP2PlannerComment_' "$body_file" && \
               grep -Fq 'Supabase Itinerary comment removal passed' "$body_file"; then
              echo "Preview /exec returned the alpha2.22 portal shell with comment lifecycle code."
              rm -f "$body_file"
              exit 0
            fi
            rm -f "$body_file"
            echo "Preview shell has not converged yet (${attempt}/12)."
            sleep 5
          done
          echo "::error::Preview /exec did not expose the alpha2.22 comment lifecycle shell."
          exit 1

      - name: Record verification summary
        shell: bash
        run: |
          echo "### Alpha2.22 preview verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apps Script preview deployment is @202." >> "$GITHUB_STEP_SUMMARY"
          echo "- Production deployment remains @199." >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview /exec contains the comment lifecycle UI/delete code." >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow performs verification only and creates no Apps Script version." >> "$GITHUB_STEP_SUMMARY"
