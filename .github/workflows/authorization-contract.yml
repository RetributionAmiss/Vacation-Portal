name: Authorization Contract

on:
  push:
    branches:
      - main
      - v4.4.0-alpha1-authorization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authorization contract tests
        run: node tests/authorization_contract.test.js
      - name: Audit public Apps Script surface
        run: node tests/public_surface_audit.js
      - name: Scan for committed secrets
        run: node tests/secret_scan.js
      - name: Run Apps Script deployment contract
        run: node tests/apps_script_deploy_contract.test.js
      - name: Run data integrity foundation contract
        run: node tests/data_integrity_foundation_contract.test.js
      - name: Run shared mutation integrity contracts
        run: node tests/shared_mutation_integrity_contract.test.js
      - name: Run privacy trust boundary contracts
        run: node tests/privacy_trust_boundaries_contract.test.js
      - name: Run privacy payload integration contracts
        run: node tests/privacy_payload_integration_contract.test.js
      - name: Run privacy pricing equivalence contracts
        run: node tests/privacy_pricing_equivalence_contract.test.js
      - name: Run participant pricing UI privacy contracts
        run: node tests/privacy_pricing_client_contract.test.js
      - name: Run UI foundation contract tests
        run: node tests/ui_foundation_contract.test.js
      - name: Run Midnight Gold Command Center theme contract
        run: node tests/midnight_gold_command_center_contract.test.js
      - name: Run UI phase 2 compact-card contracts
        run: node tests/ui_phase2_contract.test.js
      - name: Run unified background save contracts
        run: node tests/background_save_contract.test.js
      - name: Run rating/ranking voting mode contracts
        run: node tests/voting_mode_contract.test.js
      - name: Run final UI polish and accessibility contracts
        run: node tests/ui_polish_contract.test.js
      - name: Run bedroom planner draft contracts
        run: node tests/bedroom_planner_draft_contract.test.js
      - name: Run payment schedule contracts
        run: node tests/payment_schedule_contract.test.js
      - name: Run payment load performance contracts
        run: node tests/payment_load_performance_contract.test.js
      - name: Run P1 payment confirmation and Room Planner contracts
        run: node tests/p1_payment_confirmation_room_contract.test.js
      - name: Run P1 dashboard and navigation contracts
        run: node tests/p1_dashboard_navigation_contract.test.js
      - name: Run P1 Money overview contracts
        run: node tests/p1_money_overview_contract.test.js
      - name: Run payment installment generation contracts
        run: node tests/payment_installment_generation_contract.test.js
      - name: Run payment remaining balance contracts
        run: node tests/payment_remaining_balance_contract.test.js
      - name: Run planner date formatting contracts
        run: node tests/planner_date_format_contract.test.js
      - name: Run pricing branch polish contracts
        run: node tests/pricing_branch_polish_contract.test.js
      - name: Run finalized rental mode contracts
        run: node tests/finalized_rental_mode_contract.test.js
      - name: Run P2 planner experience contracts
        run: node tests/p2_planner_experience_contract.test.js
      - name: Run P2 planner refinement contracts
        run: node tests/p2_planner_refinements_contract.test.js
      - name: Run P3 Trip Mode contracts
        run: node tests/p3_trip_mode_contract.test.js
      - name: Run P3 Places and Directions contracts
        run: node tests/p3_places_directions_contract.test.js
      - name: Run planner social reliability contracts
        run: node tests/planner_social_reliability_contract.test.js
      - name: Run P3 traveler reminder contracts
        run: node tests/p3_traveler_reminders_contract.test.js
      - name: Run P3 mobile containment contracts
        run: node tests/p3_mobile_containment_contract.test.js
      - name: Run P3 smart push reminder contracts
        run: node tests/p3_smart_push_reminders_contract.test.js
      - name: Run P3 reminder delivery status and preview contracts
        run: node tests/p3_reminder_delivery_status_preview_contract.test.js
      - name: Run P3 packing readiness contracts
        run: node tests/p3_packing_readiness_contract.test.js
      - name: Run P3 travel and arrival contracts
        run: node tests/p3_travel_arrivals_contract.test.js
      - name: Run P3 Travel time formatting contracts
        run: node tests/p3_travel_time_format_contract.test.js
      - name: Run P3 Travel clock timezone contracts
        run: node tests/p3_travel_clock_timezone_contract.test.js
      - name: Run P3 startup performance contracts
        run: node tests/p3_startup_performance_contract.test.js

  deploy-apps-script:
    name: Deploy Apps Script production
    needs: authorization-contract
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: apps-script-production
      cancel-in-progress: false
    env:
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          if [[ -z "$APPS_SCRIPT_ID" ]]; then
            echo "::error::Missing repository secret APPS_SCRIPT_ID."
            exit 1
          fi
          if [[ -z "$CLASPRC_JSON" ]]; then
            echo "::error::Missing repository secret CLASPRC_JSON."
            exit 1
          fi

      - name: Configure clasp project and authentication
        shell: bash
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node <<'NODE'
          const fs = require('fs');
          const authPath = `${process.env.HOME}/.clasprc.json`;
          JSON.parse(fs.readFileSync(authPath, 'utf8'));
          fs.writeFileSync(
            '.clasp.json',
            JSON.stringify({ scriptId: process.env.APPS_SCRIPT_ID, rootDir: '.' }, null, 2) + '\n'
          );
          NODE

      - name: Resolve existing production web app deployment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('config.js', 'utf8');
          const match = config.match(/https:\/\/script\.google\.com\/macros\/s\/([^/'"\s]+)\/exec/);
          if (!match) {
            throw new Error('Could not resolve the production Apps Script deployment ID from config.js portalUrl.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `APPS_SCRIPT_DEPLOYMENT_ID=${match[1]}\n`);
          NODE

      - name: Verify clasp push scope
        run: npx --yes @google/clasp@3.4.0 status

      - name: Push main to Apps Script
        run: npx --yes @google/clasp@3.4.0 push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          npx --yes @google/clasp@3.4.0 deploy \
            -i "$APPS_SCRIPT_DEPLOYMENT_ID" \
            -d "GitHub main ${GITHUB_SHA:0:12}"

      - name: Record deployment summary
        shell: bash
        run: |
          echo "### Apps Script production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing production deployment updated in place." >> "$GITHUB_STEP_SUMMARY"
