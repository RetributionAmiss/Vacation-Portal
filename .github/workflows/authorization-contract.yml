name: Authorization Contract

on:
  push:
    branches:
      - v4.4.0-alpha1-authorization
  pull_request:
    branches:
      - main

jobs:
  authorization-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authorization contract tests
        run: node tests/authorization_contract.test.js
      - name: Audit public Apps Script surface
        run: node tests/public_surface_audit.js
      - name: Scan for committed secrets
        run: node tests/secret_scan.js
      - name: Run UI foundation contract tests
        run: node tests/ui_foundation_contract.test.js
      - name: Run UI phase 2 compact-card contracts
        run: node tests/ui_phase2_contract.test.js
      - name: Run unified background save contracts
        run: node tests/background_save_contract.test.js
      - name: Run rating/ranking voting mode contracts
        run: node tests/voting_mode_contract.test.js
