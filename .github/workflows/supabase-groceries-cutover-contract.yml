name: Supabase Groceries Cutover Contract

on:
  push:
    branches:
      - main
      - feature/supabase-groceries-primary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groceries-cutover-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Grocery host bridge syntax
        run: node --check supabase-groceries-bridge.js
      - name: Run Grocery primary cutover contract
        run: node tests/supabase_groceries_cutover_contract.test.js
      - name: Run Grocery created_by identity regression
        run: node tests/supabase_groceries_created_by_contract.test.js
      - name: Run accepted Meals primary cutover contract
        run: node tests/supabase_meals_cutover_contract.test.js
      - name: Run accepted Meals rollback idempotency contract
        run: node tests/supabase_meals_rollback_idempotency_contract.test.js
      - name: Run accepted planner-comments cutover contract
        run: node tests/supabase_planner_comments_cutover_contract.test.js
      - name: Run accepted Itinerary read regression contract
        run: node tests/supabase_itinerary_read_cutover_contract.test.js
      - name: Run accepted Itinerary write regression contract
        run: node tests/supabase_itinerary_write_cutover_contract.test.js
      - name: Run accepted Itinerary comment lifecycle contract
        run: node tests/supabase_itinerary_comment_lifecycle_contract.test.js
      - name: Run accepted Itinerary concurrency contract
        run: node tests/supabase_itinerary_concurrency_contract.test.js
      - name: Run accepted Packing cutover contract
        run: node tests/supabase_packing_read_cutover_contract.test.js
      - name: Run accepted Travel cutover contract
        run: node tests/supabase_travel_read_cutover_contract.test.js
