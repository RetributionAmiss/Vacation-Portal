name: Supabase Itinerary Cutover Contract

on:
  push:
    branches:
      - main
      - feature/supabase-itinerary-shadow-read
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  itinerary-cutover-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Itinerary host bridge syntax
        run: node --check supabase-itinerary-bridge.js
      - name: Run guarded Itinerary cutover contract
        run: node tests/supabase_itinerary_read_cutover_contract.test.js
