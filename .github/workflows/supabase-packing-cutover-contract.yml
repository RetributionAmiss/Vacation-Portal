name: Supabase Packing Cutover Contract

on:
  push:
    branches:
      - main
      - feature/supabase-packing-read-cutover
      - feature/supabase-packing-shadow-write
      - feature/supabase-packing-primary-read
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packing-cutover-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate host bridge syntax
        run: |
          node --check supabase-domain-bridge.js
          node --check supabase-packing-write-bridge.js
      - name: Run guarded Packing cutover contract
        run: node tests/supabase_packing_read_cutover_contract.test.js
