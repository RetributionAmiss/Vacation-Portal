  <div id="loadingScreen" class="loading-screen">
    <div class="mountain-mark loading-mountain-mark" aria-hidden="true">▲</div>
    <h1>Smoky Mountain Vacation</h1>
    <p id="loadingText">Opening the family portal…</p>
    <p id="loadingDetail" class="loading-detail">Connecting to the trip workbook…</p>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">FAMILY TRIP PLANNER</p>
        <h1 id="tripTitle">Smoky Mountain Family Vacation</h1>
        <p id="tripMeta" class="muted"></p>
      </div>
      <div class="topbar-actions">
        <label class="traveler-picker">
          <span>Planning as <small id="deviceProfileHint" class="device-profile-hint">· saved on this device</small></span>
          <select id="currentTraveler" onchange="changeTraveler()"></select>
        </label>
        <button id="returnToSavedTravelerButton" class="ghost temporary-traveler-return hidden" type="button" onclick="returnToSavedTraveler_()">Return to saved traveler</button>
        <button class="ghost" onclick="openCurrentTravelerInfo_()">Traveler Info</button>
        <button id="diagnosticsButton" class="ghost hidden" onclick="openDiagnostics()">Diagnostics</button>
        <button class="ghost" onclick="refreshData()">Refresh</button>
      </div>
    </header>

    <nav id="mainNav" class="main-nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="rentals">Rentals</button>
      <button data-view="travelers">Travelers</button>
      <button data-view="rooms">Room Planner</button>
      <button data-view="budget">Budget</button>
      <button data-view="meals">Meals</button>
      <button data-view="groceries">Grocery List</button>
      <button data-view="itinerary">Itinerary</button>
      <button data-view="settings">Trip Settings</button>
    </nav>

    <div id="fastStartStatus" class="fast-start-status hidden" aria-live="polite">
      <span class="progress-spinner" aria-hidden="true"></span>
      <span>Updating trip data…</span>
    </div>

    <div class="mobile-simple-nav" aria-label="Mobile navigation">
      <button type="button" class="mobile-dashboard-button" onclick="navigate('dashboard')"><span>🏠</span><span>Dashboard</span></button>
      <button type="button" class="mobile-more-button" onclick="openMobileSectionMenu_()"><span>☰</span><span>More</span></button>
    </div>
    <main id="viewRoot"></main>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <section class="modal-panel">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="backgroundSaveStatus" class="background-save-status hidden" aria-live="polite">
    <span class="progress-spinner" aria-hidden="true"></span>
    <span>Saving changes in the background…</span>
  </div>
  <div id="liveNotifications" class="live-notifications" aria-live="polite"></div>
  <div id="toast" class="toast hidden"></div>

    window.PWA_DEVICE_ID = <?!= JSON.stringify(pwaDeviceId || '') ?>;
