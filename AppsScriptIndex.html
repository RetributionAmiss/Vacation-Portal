  <script>
    window.PWA_DEVICE_ID = <?!= JSON.stringify(pwaDeviceId || '') ?>;
    window.PWA_INSTALLED = <?!= pwaInstalled ? 'true' : 'false' ?>;
    if(!window.PWA_DEVICE_ID){
      window.PWA_DIRECT_DEVICE=true;
      try{
        const directDeviceKey='vacationDirectWebDeviceIdV1';
        let directDeviceId=String(localStorage.getItem(directDeviceKey)||'').trim();
        if(!directDeviceId){
          const randomPart=(window.crypto&&window.crypto.randomUUID)
            ? window.crypto.randomUUID().replace(/-/g,'')
            : (Date.now().toString(36)+Math.random().toString(36).slice(2));
          directDeviceId='WEB-'+randomPart;
          localStorage.setItem(directDeviceKey,directDeviceId);
        }
        window.PWA_DEVICE_ID=directDeviceId;
      }catch(error){
        window.PWA_DEVICE_ID='WEB-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
      }
    }
  </script>
