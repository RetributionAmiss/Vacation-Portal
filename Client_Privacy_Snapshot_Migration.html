<script>
/* PR #34 one-time browser cache migration.
 * Older portal releases stored complete traveler rows in the fast-start
 * localStorage snapshot. Remove that historical snapshot once per device so a
 * pre-privacy payload can never be rendered before the new server response.
 */
(function privacyMigrateLegacyStartupSnapshot_(){
  const marker='vacationPortalPrivacySnapshotMigrationV1';
  const legacySnapshot='vacationPortalStartupSnapshotV420';

  try{
    if(localStorage.getItem(marker)!=='1'){
      localStorage.removeItem(legacySnapshot);
      localStorage.setItem(marker,'1');
    }
  }catch(error){}
})();

/* If the organizer authorization dialog is cancelled while a privacy-gated
 * data load is waiting, clear that loader state so a later retry works.
 * Client_Privacy_Integration initializes these globals before the user can
 * invoke the dialog.
 */
const privacyCancelOrganizerAuthorizationBefore_=cancelOrganizerAuthorization_;
cancelOrganizerAuthorization_=function(){
  if(typeof privacyOrganizerTravelerLoading_!=='undefined'){
    privacyOrganizerTravelerLoading_=false;
  }
  if(typeof privacyOrganizerTravelerCallbacks_!=='undefined'){
    privacyOrganizerTravelerCallbacks_=[];
  }
  return privacyCancelOrganizerAuthorizationBefore_.apply(this,arguments);
};
</script>
