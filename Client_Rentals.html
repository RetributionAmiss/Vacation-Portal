<script>
function includedBudgetExtras_(){
  return (DATA.budget||[]).filter(function(item){
    return String(item['Include in Rental Split']||'No')==='Yes' &&
      Number(item.Amount||0)>0;
  });
}

function includedBudgetExtrasTotal_(){
  return includedBudgetExtras_().reduce(function(total,item){
    return total+Number(item.Amount||0);
  },0);
}

function rentalCostBasis_(cabin){
  return Number(cabin&&cabin['Total Rental Cost']||0) +
    includedBudgetExtrasTotal_();
}

function renderIncludedExtras_(cabin){
  const extras=includedBudgetExtrasTotal_();
  const rental=Number(cabin&&cabin['Total Rental Cost']||0);

  if(!extras || !rental) return '';

  return `<div class="included-budget-cost">
    <span>Rental + shared extras</span>
    <strong>${money(rentalCostBasis_(cabin))}</strong>
    <small>${money(rental)} rental + ${money(extras)} included budget extras</small>
  </div>`;
}

function activeAdultTravelers_(){
  return (DATA.travelers||[]).filter(function(traveler){
    return String(traveler.Active||'Yes').toLowerCase()!=='no' &&
      String(traveler['Traveler Type']||'Adult')==='Adult';
  });
}

function travelerPriceCap_(traveler){
  return Math.max(0,Number(traveler&&traveler['Price Cap']||0));
}

function travelerWillPayMore_(traveler){
  return String(traveler&&traveler['Pay More']||'No')==='Yes';
}

function travelerCostPercent_(traveler){
  if(!traveler) return 100;

  const raw=traveler['Cost %'];

  if(raw==='' || raw===null || raw===undefined){
    return 100;
  }

  const value=Number(raw);

  if(!isFinite(value)) return 100;

  return Math.max(0,Math.min(100,value));
}

function travelerCostWeight_(traveler){
  return travelerCostPercent_(traveler)/100;
}

function pricingTotal_(cabin,includeExtras){
  const rental=Number(cabin&&cabin['Total Rental Cost']||0);

  return rental + (
    includeExtras
      ? includedBudgetExtrasTotal_()
      : 0
  );
}

function redistributeCappedCosts_(baseRows,totalCost){
  const epsilon=.005;
  const rows=baseRows.map(function(row){
    const traveler=row.traveler;
    const cap=travelerPriceCap_(traveler);
    const base=Math.max(0,Number(row.base||0));
    const capped=cap>0 && base>cap;

    return {
      travelerId:traveler['Traveler ID'],
      travelerName:traveler.Name||'Traveler',
      traveler:traveler,
      base:base,
      cap:cap,
      payMore:travelerWillPayMore_(traveler),
      costPercent:travelerCostPercent_(traveler),
      amount:capped?cap:base,
      capped:capped,
      extra:0
    };
  });

  let remainder=Math.max(
    0,
    Number(totalCost||0)-
      rows.reduce(function(sum,row){return sum+row.amount;},0)
  );

  // Repeatedly spread the remainder across willing travelers who still
  // have capacity under their own cap. A cap of 0 means unlimited.
  let safety=0;
  while(remainder>epsilon && safety<50){
    safety++;

    const eligible=rows.filter(function(row){
      if(!row.payMore) return false;

      if(row.cap<=0) return true;
      return row.amount<row.cap-epsilon;
    });

    if(!eligible.length) break;

    const equalExtra=remainder/eligible.length;
    let distributed=0;

    eligible.forEach(function(row){
      const capacity=row.cap>0
        ? Math.max(0,row.cap-row.amount)
        : equalExtra;

      const add=row.cap>0
        ? Math.min(equalExtra,capacity)
        : equalExtra;

      row.amount+=add;
      row.extra+=add;
      distributed+=add;
    });

    if(distributed<=epsilon) break;
    remainder=Math.max(0,remainder-distributed);
  }

  return {
    rows:rows,
    unresolved:remainder,
    total:Number(totalCost||0),
    covered:Number(totalCost||0)-remainder
  };
}

function cappedAdultSplit_(cabin,totalOverride){
  const adults=activeAdultTravelers_();
  const total=
    totalOverride===undefined
      ? rentalCostBasis_(cabin)
      : Number(totalOverride||0);

  if(!adults.length || !total){
    return {rows:[],unresolved:0,total:total,covered:0};
  }

  let totalWeight=adults.reduce(function(sum,traveler){
    return sum+travelerCostWeight_(traveler);
  },0);

  // Prevent an accidental all-zero configuration from making the split unusable.
  if(totalWeight<=0){
    totalWeight=adults.length;
  }

  const unit=total/totalWeight;

  return redistributeCappedCosts_(
    adults.map(function(traveler){
      const weight=travelerCostWeight_(traveler);

      return {
        traveler:traveler,
        base:
          totalWeight===adults.length && weight===0
            ? unit
            : unit*weight
      };
    }),
    total
  );
}

function cappedBedroomSplit_(cabin,totalOverride){
  const adults=activeAdultTravelers_();
  const total=
    totalOverride===undefined
      ? rentalCostBasis_(cabin)
      : Number(totalOverride||0);

  const bedrooms=(cabin&&cabin.bedrooms||[]);
  const bedroomCount=bedrooms.length || Number(cabin&&cabin.Bedrooms||0);

  if(!adults.length || !total || !bedroomCount){
    return {rows:[],unresolved:total||0,total:total,covered:0};
  }

  const roomShare=total/bedroomCount;
  const assignments=(DATA.assignments||[]).filter(function(a){
    return a['Cabin ID']===cabin['Cabin ID'];
  });

  const adultAssignmentMap={};

  assignments.forEach(function(a){
    const traveler=adults.find(function(t){
      return t['Traveler ID']===a['Traveler ID'];
    });

    if(traveler){
      adultAssignmentMap[a['Traveler ID']]=a['Bedroom ID'];
    }
  });

  const baseByTraveler={};

  adults.forEach(function(traveler){
    baseByTraveler[traveler['Traveler ID']]=0;
  });

  const bedroomIds=bedrooms.length
    ? bedrooms.map(function(room){return room['Bedroom ID'];})
    : Array.from({length:bedroomCount},function(_,i){return 'ROOM-'+i;});

  bedroomIds.forEach(function(bedroomId){
    const roomAdults=adults.filter(function(traveler){
      return adultAssignmentMap[traveler['Traveler ID']]===bedroomId;
    });

    if(!roomAdults.length) return;

    let roomWeight=roomAdults.reduce(function(sum,traveler){
      return sum+travelerCostWeight_(traveler);
    },0);

    if(roomWeight<=0){
      roomWeight=roomAdults.length;
    }

    roomAdults.forEach(function(traveler){
      const weight=travelerCostWeight_(traveler);

      baseByTraveler[traveler['Traveler ID']]+=
        roomShare*(
          roomWeight===roomAdults.length && weight===0
            ? 1/roomAdults.length
            : weight/roomWeight
        );
    });
  });

  // Adults with no room assignment start at $0. Empty rooms create an
  // uncovered balance which can be absorbed by Pay More travelers.
  return redistributeCappedCosts_(
    adults.map(function(traveler){
      return {
        traveler:traveler,
        base:Number(baseByTraveler[traveler['Traveler ID']]||0)
      };
    }),
    total
  );
}

function travelerAdjustedCost_(cabin,mode,travelerId){
  const result=mode==='bedroom'
    ? cappedBedroomSplit_(cabin)
    : cappedAdultSplit_(cabin);

  const row=result.rows.find(function(item){
    return item.travelerId===travelerId;
  });

  return row ? Number(row.amount||0) : 0;
}

function capPricingConfigured_(){
  return activeAdultTravelers_().some(function(traveler){
    return travelerPriceCap_(traveler)>0 ||
      travelerWillPayMore_(traveler) ||
      travelerCostPercent_(traveler)!==100;
  });
}

function capPricingSummary_(cabin){
  const adultResult=cappedAdultSplit_(cabin);
  const bedroomResult=cappedBedroomSplit_(cabin);

  return {
    cappedAdults:adultResult.rows.filter(function(row){
      return row.capped;
    }).length,
    payMoreAdults:adultResult.rows.filter(function(row){
      return row.payMore;
    }).length,
    adultUnresolved:Number(adultResult.unresolved||0),
    bedroomUnresolved:Number(bedroomResult.unresolved||0)
  };
}

function renderCapAdjustedCost_(cabin){
  if(!currentTravelerId || !capPricingConfigured_()) return '';

  const adultResult=cappedAdultSplit_(cabin);
  const bedroomResult=cappedBedroomSplit_(cabin);

  const adultRow=adultResult.rows.find(function(row){
    return row.travelerId===currentTravelerId;
  });

  const bedroomRow=bedroomResult.rows.find(function(row){
    return row.travelerId===currentTravelerId;
  });

  if(!adultRow && !bedroomRow) return '';

  const traveler=travelerById_(currentTravelerId);
  const cap=travelerPriceCap_(traveler);
  const summary=capPricingSummary_(cabin);

  return `<div class="cap-adjusted-cost cap-adjusted-cost-visible">
    <div class="cap-adjusted-title">
      <span>Price caps applied</span>
      <button
        class="ghost tiny"
        type="button"
        onclick="openCapPricingBreakdown_('${cabin['Cabin ID']}')"
      >View full split</button>
    </div>

    <div class="cap-adjusted-grid">
      ${
        adultRow
          ? `<div>
              <small>Equal adult base</small>
              <strong>${money(adultRow.base)}</strong>
            </div>
            <div>
              <small>Your adjusted adult cost</small>
              <strong>${money(adultRow.amount)}</strong>
            </div>`
          : ''
      }

      ${
        bedroomRow && bedroomRow.base>0
          ? `<div>
              <small>Your bedroom base</small>
              <strong>${money(bedroomRow.base)}</strong>
            </div>
            <div>
              <small>Your adjusted bedroom cost</small>
              <strong>${money(bedroomRow.amount)}</strong>
            </div>`
          : ''
      }
    </div>

    <div class="cap-adjusted-flags">
      ${
        cap>0
          ? `<span>Max: ${money(cap)}</span>`
          : '<span>No personal cap</span>'
      }
      ${
        travelerWillPayMore_(traveler)
          ? '<span class="pay-more-flag">Willing to Pay More</span>'
          : ''
      }
      ${
        summary.cappedAdults
          ? `<span>${summary.cappedAdults} traveler${summary.cappedAdults===1?'':'s'} capped</span>`
          : ''
      }
    </div>

    ${
      adultRow.capped || (bedroomRow&&bedroomRow.capped)
        ? '<em>Your maximum lodging cost is actively limiting this split.</em>'
        : adultRow.extra>0 || (bedroomRow&&bedroomRow.extra>0)
          ? `<em>You are absorbing ${
              money(Math.max(adultRow.extra||0,bedroomRow?bedroomRow.extra||0:0))
            } of redistributed cost.</em>`
          : ''
    }

    ${
      summary.adultUnresolved>.01
        ? `<div class="cap-unresolved-warning">
            ${money(summary.adultUnresolved)} remains uncovered in the adult split.
          </div>`
        : ''
    }
  </div>`;
}

function capSplitRowHtml_(row,mode,cabin){
  const assigned=mode==='Bedroom'
    ? assignedBedroomForTraveler_(cabin['Cabin ID'],row.travelerId)
    : null;

  const roomName=
    assigned&&assigned.bedroom
      ? assigned.bedroom['Bedroom Name']
      : '';

  return `<div class="cap-split-row ${
    row.capped?'capped':''
  } ${row.extra>0?'paying-extra':''}">
    <div>
      <strong>${esc(row.travelerName)}</strong>
      ${
        roomName
          ? `<span>${esc(roomName)}</span>`
          : ''
      }
      <small>
        Base ${money(row.base)}
        · ${row.cap>0?'Cap '+money(row.cap):'No cap'}
        ${row.payMore?' · Pay More':''}
      </small>
    </div>
    <div class="cap-split-amount">
      <strong>${money(row.amount)}</strong>
      ${
        row.capped
          ? '<small>Cap applied</small>'
          : row.extra>0
            ? `<small>+${money(row.extra)} redistributed</small>`
            : '<small>Standard share</small>'
      }
    </div>
  </div>`;
}

function openCapPricingBreakdown_(cabinId){
  const cabin=(DATA.cabins||[]).find(function(item){
    return item['Cabin ID']===cabinId;
  });

  if(!cabin){
    toast('Rental could not be found.',true);
    return;
  }

  const adultResult=cappedAdultSplit_(cabin);
  const bedroomResult=cappedBedroomSplit_(cabin);
  const extras=includedBudgetExtrasTotal_();

  openModal(`<div class="cap-pricing-modal">
    <p class="eyebrow">COST SPLIT</p>
    <h2>${esc(displayName(cabin))}</h2>

    <div class="cap-pricing-basis">
      <div>
        <span>Rental</span>
        <strong>${money(cabin['Total Rental Cost']||0)}</strong>
      </div>
      <div>
        <span>Included extras</span>
        <strong>${money(extras)}</strong>
      </div>
      <div>
        <span>Split total</span>
        <strong>${money(rentalCostBasis_(cabin))}</strong>
      </div>
    </div>

    <section class="cap-split-section">
      <div class="cap-split-heading">
        <div>
          <h3>Adult split with caps</h3>
          <p class="muted">
            Equal adult share first, then caps and Pay More redistribution.
          </p>
        </div>
        ${
          adultResult.unresolved>.01
            ? `<span class="cap-balance-badge warning">
                ${money(adultResult.unresolved)} uncovered
              </span>`
            : '<span class="cap-balance-badge">Fully covered</span>'
        }
      </div>

      <div class="cap-split-list">
        ${adultResult.rows
          .slice()
          .sort(function(a,b){
            return String(a.travelerName).localeCompare(String(b.travelerName));
          })
          .map(function(row){
            return capSplitRowHtml_(row,'Adult',cabin);
          }).join('')}
      </div>
    </section>

    <section class="cap-split-section">
      <div class="cap-split-heading">
        <div>
          <h3>Bedroom split with caps</h3>
          <p class="muted">
            Bedroom share is split among assigned adults, then caps and Pay More are applied.
          </p>
        </div>
        ${
          bedroomResult.unresolved>.01
            ? `<span class="cap-balance-badge warning">
                ${money(bedroomResult.unresolved)} uncovered
              </span>`
            : '<span class="cap-balance-badge">Fully covered</span>'
        }
      </div>

      ${
        (DATA.assignments||[]).some(function(a){
          return a['Cabin ID']===cabinId;
        })
          ? `<div class="cap-split-list">
              ${bedroomResult.rows
                .slice()
                .sort(function(a,b){
                  return String(a.travelerName).localeCompare(String(b.travelerName));
                })
                .map(function(row){
                  return capSplitRowHtml_(row,'Bedroom',cabin);
                }).join('')}
            </div>`
          : `<div class="notice">
              Assign travelers to bedrooms to calculate the bedroom-based capped split.
            </div>`
      }
    </section>
  </div>`);
}


function adultTravelerCount_(){
  return (DATA.travelers||[]).filter(function(traveler){
    return String(traveler.Active||'Yes').toLowerCase()!=='no' &&
      String(traveler['Traveler Type']||'Adult')==='Adult';
  }).length;
}

function perAdultTravelerCost_(cabin){
  const adults=adultTravelerCount_();
  const total=rentalCostBasis_(cabin);

  return adults>0 && total>0 ? total/adults : 0;
}

function renderPerAdultCost_(cabin){
  const adults=adultTravelerCount_();
  const cost=perAdultTravelerCost_(cabin);

  if(!cost) return '';

  return `<div class="per-adult-cost">
    <span>Per adult traveler</span>
    <strong>${money(cost)}</strong>
    <small>Total trip cost ÷ ${adults} adult${adults===1?'':'s'}</small>
  </div>`;
}


function bedroomCountForPricing_(cabin){
  const detailed=(cabin.bedrooms||[]).length;
  const stated=Number(cabin.Bedrooms||0);

  return detailed>0 ? detailed : stated;
}

function perBedroomCost_(cabin){
  const bedrooms=bedroomCountForPricing_(cabin);
  const total=rentalCostBasis_(cabin);

  return bedrooms>0 && total>0 ? total/bedrooms : 0;
}

function bedroomAdultOccupancySummary_(cabin){
  const bedrooms=(cabin&&cabin.bedrooms||[]);
  if(!bedrooms.length) return null;

  const assignments=(DATA.assignments||[]).filter(function(assignment){
    return assignment['Cabin ID']===cabin['Cabin ID'];
  });

  if(!assignments.length) return null;

  const counts={};
  let occupiedBedrooms=0;
  let unoccupiedBedrooms=0;

  bedrooms.forEach(function(room){
    const adultCount=assignments.filter(function(assignment){
      if(assignment['Bedroom ID']!==room['Bedroom ID']) return false;

      const traveler=(DATA.travelers||[]).find(function(item){
        return item['Traveler ID']===assignment['Traveler ID'];
      });

      return traveler &&
        String(traveler.Active||'Yes').toLowerCase()!=='no' &&
        String(traveler['Traveler Type']||'Adult')==='Adult';
    }).length;

    if(adultCount>0){
      occupiedBedrooms++;
      counts[adultCount]=(counts[adultCount]||0)+1;
    }else{
      unoccupiedBedrooms++;
    }
  });

  if(!occupiedBedrooms) return null;

  return {
    counts:counts,
    occupiedBedrooms:occupiedBedrooms,
    unoccupiedBedrooms:unoccupiedBedrooms,
    totalBedrooms:bedrooms.length
  };
}

function bedroomOccupancyPricingText_(cabin){
  const summary=bedroomAdultOccupancySummary_(cabin);
  const bedroomCost=perBedroomCost_(cabin);

  if(!summary || !bedroomCost) return '';

  return Object.keys(summary.counts)
    .map(Number)
    .sort(function(a,b){return a-b;})
    .map(function(adultCount){
      const roomCount=summary.counts[adultCount];

      return roomCount+
        ' bedroom'+(roomCount===1?'':'s')+
        ' @ '+adultCount+
        ' adult'+(adultCount===1?'':'s')+
        ' · '+money(bedroomCost/adultCount)+' each';
    })
    .join(' | ');
}

function renderBedroomCost_(cabin){
  const bedrooms=bedroomCountForPricing_(cabin);
  const bedroomCost=perBedroomCost_(cabin);
  const occupancy=bedroomAdultOccupancySummary_(cabin);

  if(!bedroomCost) return '';

  return `<div class="bedroom-cost">
    <span>Per bedroom</span>
    <strong>${money(bedroomCost)}</strong>
    <small>
      Total trip cost ÷ ${bedrooms} bedroom${bedrooms===1?'':'s'}
    </small>

    ${
      occupancy
        ? `<div class="bedroom-occupancy-pricing">
            <div class="bedroom-occupancy-heading">
              <strong>Based on current room assignments</strong>
              <span>
                ${occupancy.occupiedBedrooms} of ${occupancy.totalBedrooms}
                bedroom${occupancy.totalBedrooms===1?'':'s'} have paying adults assigned
              </span>
            </div>

            <div class="bedroom-occupancy-groups">
              ${Object.keys(occupancy.counts)
                .map(Number)
                .sort(function(a,b){return a-b;})
                .map(function(adultCount){
                  const roomCount=occupancy.counts[adultCount];
                  const each=bedroomCost/adultCount;

                  return `<div class="bedroom-occupancy-group">
                    <strong>
                      ${roomCount} bedroom${roomCount===1?'':'s'}
                    </strong>
                    <span>
                      @ ${adultCount} adult${adultCount===1?'':'s'}
                    </span>
                    <em>${money(each)} per adult</em>
                  </div>`;
                }).join('')}
            </div>

            ${
              occupancy.unoccupiedBedrooms>0
                ? `<small class="bedroom-unassigned-note">
                    ${occupancy.unoccupiedBedrooms}
                    bedroom${occupancy.unoccupiedBedrooms===1?'':'s'}
                    currently ${
                      occupancy.unoccupiedBedrooms===1?'has':'have'
                    } no paying adult assigned.
                  </small>`
                : ''
            }
          </div>`
        : `<div class="bedroom-sharing-examples">
            <span>1 adult: <strong>${money(bedroomCost)} each</strong></span>
            <span>2 adults sharing: <strong>${money(bedroomCost/2)} each</strong></span>
            <span>3 adults sharing: <strong>${money(bedroomCost/3)} each</strong></span>
            <span>4 adults sharing: <strong>${money(bedroomCost/4)} each</strong></span>
          </div>`
    }
  </div>`;
}

function travelerById_(travelerId){
  return (DATA.travelers||[]).find(function(traveler){
    return traveler['Traveler ID']===travelerId;
  })||null;
}

function travelerIsAdult_(travelerId){
  const traveler=travelerById_(travelerId);
  return Boolean(
    traveler &&
    String(traveler.Active||'Yes').toLowerCase()!=='no' &&
    String(traveler['Traveler Type']||'Adult')==='Adult'
  );
}

function cabinBedroomAssignments_(cabinId){
  return (DATA.assignments||[]).filter(function(assignment){
    return assignment['Cabin ID']===cabinId;
  });
}

function assignedBedroomForTraveler_(cabinId,travelerId){
  const assignment=cabinBedroomAssignments_(cabinId).find(function(item){
    return item['Traveler ID']===travelerId;
  });

  if(!assignment) return null;

  const cabin=(DATA.cabins||[]).find(function(item){
    return item['Cabin ID']===cabinId;
  });

  const bedroom=cabin && (cabin.bedrooms||[]).find(function(room){
    return room['Bedroom ID']===assignment['Bedroom ID'];
  });

  return {
    assignment:assignment,
    bedroom:bedroom||null
  };
}

function assignedAdultCountForBedroom_(cabinId,bedroomId){
  return cabinBedroomAssignments_(cabinId).filter(function(assignment){
    return assignment['Bedroom ID']===bedroomId &&
      travelerIsAdult_(assignment['Traveler ID']);
  }).length;
}

function assignedTravelerCost_(cabin,travelerId){
  if(!cabin || !travelerId) return 0;
  if(!travelerIsAdult_(travelerId)) return 0;

  const assigned=assignedBedroomForTraveler_(
    cabin['Cabin ID'],
    travelerId
  );

  if(!assigned || !assigned.assignment) return 0;

  const bedroomId=assigned.assignment['Bedroom ID'];
  const adultsSharing=assignedAdultCountForBedroom_(
    cabin['Cabin ID'],
    bedroomId
  );

  const roomShare=perBedroomCost_(cabin);

  return roomShare>0 && adultsSharing>0
    ? roomShare/adultsSharing
    : 0;
}

function assignedTravelerCostSummary_(cabin){
  const assignments=cabinBedroomAssignments_(cabin['Cabin ID']);
  if(!assignments.length) return null;

  const adults=assignments.filter(function(assignment){
    return travelerIsAdult_(assignment['Traveler ID']);
  });

  if(!adults.length) return null;

  const rows=adults.map(function(assignment){
    const traveler=travelerById_(assignment['Traveler ID']);
    const bedroom=(cabin.bedrooms||[]).find(function(room){
      return room['Bedroom ID']===assignment['Bedroom ID'];
    })||null;

    const adultsSharing=assignedAdultCountForBedroom_(
      cabin['Cabin ID'],
      assignment['Bedroom ID']
    );

    const roomShare=perBedroomCost_(cabin);
    const amount=adultsSharing>0 ? roomShare/adultsSharing : 0;

    return {
      travelerId:assignment['Traveler ID'],
      travelerName:traveler ? traveler.Name : assignment['Traveler ID'],
      bedroomName:bedroom ? bedroom['Bedroom Name'] : 'Assigned bedroom',
      adultsSharing:adultsSharing,
      amount:amount
    };
  });

  return {
    rows:rows,
    assignedAdults:rows.length,
    totalAssignedCost:rows.reduce(function(total,row){
      return total+Number(row.amount||0);
    },0)
  };
}

function renderMyAssignedCost_(cabin){
  if(!currentTravelerId) return '';

  const assigned=assignedBedroomForTraveler_(
    cabin['Cabin ID'],
    currentTravelerId
  );

  if(!assigned) return '';

  const traveler=travelerById_(currentTravelerId);
  const isAdult=travelerIsAdult_(currentTravelerId);
  const bedroomName=assigned.bedroom
    ? assigned.bedroom['Bedroom Name']
    : 'Assigned bedroom';

  if(!isAdult){
    return `<div class="my-assigned-cost child">
      <span>Your assigned room</span>
      <strong>${esc(bedroomName)}</strong>
      <small>Child traveler — no lodging share calculated.</small>
    </div>`;
  }

  const adultsSharing=assignedAdultCountForBedroom_(
    cabin['Cabin ID'],
    assigned.assignment['Bedroom ID']
  );

  const amount=assignedTravelerCost_(cabin,currentTravelerId);

  if(!amount) return '';

  return `<div class="my-assigned-cost">
    <span>Your assigned room cost</span>
    <strong>${money(amount)}</strong>
    <small>

const rentalPricingUiState_={};

function rentalPricingState_(cabinId){
  if(!rentalPricingUiState_[cabinId]){
    rentalPricingUiState_[cabinId]={
      mode:'adult',
      includeExtras:true,
      showSharing:false,
      showAssignments:false
    };
  }

  return rentalPricingUiState_[cabinId];
}

function updateRentalPricingOption_(cabinId,key,value){
  const state=rentalPricingState_(cabinId);

  if(key==='mode') state.mode=value;
  else state[key]=Boolean(value);

  const cabin=(DATA.cabins||[]).find(function(item){
    return item['Cabin ID']===cabinId;
  });

  const container=document.getElementById('pricing-'+cabinId);

  if(cabin&&container){
    container.outerHTML=renderRentalPricingConsole_(cabin);
  }
}

function rentalPricingPrimary_(cabin,state){
  const total=pricingTotal_(cabin,state.includeExtras);

  if(state.mode==='total'){
    return {
      label:state.includeExtras?'Trip total + shared extras':'Rental trip total',
      value:total,
      note:state.includeExtras && includedBudgetExtrasTotal_()
        ? money(Number(cabin['Total Rental Cost']||0))+' rental + '+
          money(includedBudgetExtrasTotal_())+' shared extras'
        : 'Rental lodging total'
    };
  }

  if(state.mode==='bedroom'){
    const result=cappedBedroomSplit_(cabin,total);
    const row=result.rows.find(function(item){
      return item.travelerId===currentTravelerId;
    });

    if(row&&row.base>0){
      return {
        label:'Your bedroom-based share',
        value:row.amount,
        note:
          'Base '+money(row.base)+
          ' · Cost '+Math.round(row.costPercent||100)+'%'+
          (row.cap>0?' · Cap '+money(row.cap):'')
      };
    }

    const bedrooms=bedroomCountForPricing_(cabin);

    return {
      label:'Per bedroom',
      value:bedrooms?total/bedrooms:0,
      note:bedrooms
        ? 'Trip cost ÷ '+bedrooms+' bedrooms'
        : 'Bedroom count pending'
    };
  }

  const result=cappedAdultSplit_(cabin,total);
  const row=result.rows.find(function(item){
    return item.travelerId===currentTravelerId;
  });

  if(row){
    return {
      label:'Your adult-based share',
      value:row.amount,
      note:
        'Weighted base '+money(row.base)+
        ' · Cost '+Math.round(row.costPercent||100)+'%'+
        (row.cap>0?' · Cap '+money(row.cap):'')
    };
  }

  const adults=activeAdultTravelers_();

  return {
    label:'Per adult',
    value:adults.length?total/adults.length:0,
    note:adults.length
      ? 'Trip cost ÷ '+adults.length+' adults'
      : 'Adult count pending'
  };
}

function rentalBedroomSharingBreakout_(cabin,total){
  const bedrooms=(cabin.bedrooms||[]);
  const result=cappedBedroomSplit_(cabin,total);

  if(!bedrooms.length){
    return '<div class="pricing-breakout-empty">Bedroom details are not available yet.</div>';
  }

  const rows=bedrooms.map(function(room){
    const assigned=(DATA.assignments||[]).filter(function(a){
      return a['Cabin ID']===cabin['Cabin ID'] &&
        a['Bedroom ID']===room['Bedroom ID'];
    });

    const adultRows=assigned.map(function(a){
      return result.rows.find(function(row){
        return row.travelerId===a['Traveler ID'];
      });
    }).filter(Boolean);

    if(!adultRows.length) return '';

    return `<div class="pricing-room-row">
      <strong>${esc(room['Bedroom Name']||'Bedroom')}</strong>
      <span>
        ${adultRows.map(function(row){
          return esc(row.travelerName)+' '+money(row.amount)+
            (row.costPercent!==100?' ('+Math.round(row.costPercent)+'%)':'');
        }).join(' · ')}
      </span>
    </div>`;
  }).filter(Boolean);

  return rows.length
    ? rows.join('')
    : '<div class="pricing-breakout-empty">Assign adults to bedrooms to see the sharing breakout.</div>';
}

function rentalCurrentAssignmentBreakout_(cabin,total){
  const result=cappedBedroomSplit_(cabin,total);

  const rows=result.rows.filter(function(row){
    return row.base>0;
  });

  if(!rows.length){
    return '<div class="pricing-breakout-empty">No current adult room assignments.</div>';
  }

  return rows
    .slice()
    .sort(function(a,b){
      return String(a.travelerName).localeCompare(String(b.travelerName));
    })
    .map(function(row){
      const assigned=assignedBedroomForTraveler_(
        cabin['Cabin ID'],
        row.travelerId
      );

      return `<div class="pricing-assignment-row">
        <span>
          <strong>${esc(row.travelerName)}</strong>
          <small>${
            assigned&&assigned.bedroom
              ? esc(assigned.bedroom['Bedroom Name'])
              : 'Assigned room'
          } · ${Math.round(row.costPercent||100)}%</small>
        </span>
        <strong>${money(row.amount)}</strong>
      </div>`;
    }).join('');
}

  })||null;
}

function familyVoteSummary_(cabinId){
  const eligible=(DATA.travelers||[]).filter(function(traveler){
    return String(traveler.Active||'Yes').toLowerCase()!=='no';
  });

  // One review per traveler, even if older duplicate rows exist.
  const latestByTraveler={};

  currentRoundVotesForCabin_(cabinId).forEach(function(vote){
    const travelerId=String(vote['Traveler ID']||'').trim();
    if(!travelerId) return;

    const current=latestByTraveler[travelerId];
    const incomingTime=new Date(vote['Created At']||0).getTime()||0;
    const currentTime=current
      ? (new Date(current['Created At']||0).getTime()||0)
      : -1;

    if(!current||incomingTime>=currentTime){
      latestByTraveler[travelerId]=vote;
    }
  });

  const votes=Object.keys(latestByTraveler).map(function(travelerId){
    return latestByTraveler[travelerId];
  });

  const scores=votes
    .map(function(vote){return Number(vote.Score||0);})
    .filter(function(score){return score>=1&&score<=5;});

  return {
    votes:votes,
    reviewed:votes.length,
    total:eligible.length,
    percent:eligible.length
      ? Math.round(votes.length/eligible.length*100)
      : 0,
    average:scores.length
      ? scores.reduce(function(total,score){return total+score;},0)/scores.length
      : 0
  };
}

function familyReviewStats_(cabinId){
  const summary=familyVoteSummary_(cabinId);
  return {
    reviewed:summary.reviewed,
    total:summary.total,
    percent:summary.percent
  };
}

function starText_(score){
  const value=Math.max(0,Math.min(5,Number(score||0)));
  return '★'.repeat(value)+'☆'.repeat(5-value);
}

function voteReasons_(vote){
  return String(vote&&vote.Reasons||'')
    .split('|')
    .map(function(value){return value.trim();})
    .filter(Boolean);
}

function topFamilyReasons_(cabinId){
  const counts={};

  currentRoundVotesForCabin_(cabinId).forEach(function(vote){
    voteReasons_(vote).forEach(function(reason){
      counts[reason]=Number(counts[reason]||0)+1;
    });
  });

  return Object.keys(counts)
    .map(function(reason){return {reason:reason,count:counts[reason]};})
    .sort(function(left,right){
      return right.count-left.count ||
        left.reason.localeCompare(right.reason);
    })
    .slice(0,3);
}

function reasonIcon_(reason){
  const match=VOTE_REASON_OPTIONS_.find(function(option){
    return option[0]===reason;

  return match?match[1]:'✓';

function rankedTopPicks_(){
  return (DATA.cabins||[])
    .map(function(cabin){
      const summary=familyVoteSummary_(cabin['Cabin ID']);

      return {
        cabin:cabin,
        summary:summary,
        score:
          summary.average*10+
          Number(cabin.favoriteCount||0)*1.5+
          Math.min(summary.reviewed,10)
      };
    })
    .filter(function(item){
      return item.summary.reviewed>0;
    })
    .sort(function(left,right){
      return right.score-left.score ||
        right.summary.reviewed-left.summary.reviewed ||
        String(displayName(left.cabin)).localeCompare(
          String(displayName(right.cabin))
        );
    })
    .slice(0,3);
}

    capCoverageAdult:cappedAdultSplit_(cabin).unresolved>.01

      : 'Fully covered',
    capCoverageBedroom:cappedBedroomSplit_(cabin).unresolved>.01
      ? money(cappedBedroomSplit_(cabin).unresolved)+' uncovered'
      : 'Fully covered',
    nightly:Number(cabin['Nightly Rate']||0)?money(cabin['Nightly Rate']):'Pending',
    sleeps:cabin.Sleeps||'?',
    bedrooms:cabin.Bedrooms||'?',

    familyReviews:

    myRating:myVote?Number(myVote.Score)+'/5':'Not reviewed',

    pool:detail.Pool||derived.pool||'Not confirmed',
    hotTub:detail['Hot Tub']||derived.hotTub||'Not confirmed',

  return values[key];
}

function comparisonBestClasses_(cabins,key){
  const modes={
    total:'min', combinedTotal:'min', perAdult:'min', perBedroom:'min', sharedBedroom2:'min',
    myAssignedCost:'min', cappedAdultCost:'min', cappedBedroomCost:'min',
    nightly:'min', sleeps:'max', bedrooms:'max',
    bathrooms:'max', rating:'max', reviews:'max',
    familyScore:'max', favorites:'max'
  };

  if(!modes[key]) return cabins.map(function(){return '';});

  const numbers=cabins.map(function(cabin){
    if(key==='familyScore'){
      const summary=familyVoteSummary_(cabin['Cabin ID']);
      return summary.reviewed?summary.average:null;
    }

    const map={
      total:Number(cabin['Total Rental Cost']||0),
      combinedTotal:rentalCostBasis_(cabin),
      perAdult:perAdultTravelerCost_(cabin),
      perBedroom:perBedroomCost_(cabin),
      sharedBedroom2:perBedroomCost_(cabin)
        ? perBedroomCost_(cabin)/2
        : 0,
      myAssignedCost:assignedTravelerCost_(cabin,currentTravelerId),
      cappedAdultCost:travelerAdjustedCost_(cabin,'adult',currentTravelerId),
      cappedBedroomCost:travelerAdjustedCost_(cabin,'bedroom',currentTravelerId),
      nightly:Number(cabin['Nightly Rate']||0),
      sleeps:Number(cabin.Sleeps||0),
      bedrooms:Number(cabin.Bedrooms||0),
      bathrooms:Number(cabin.Bathrooms||0),
      rating:Number(cabin.Rating||0),
      reviews:Number(cabin['Review Count']||0),
      favorites:Number(cabin.favoriteCount||0)
    };

    return map[key]>0?map[key]:null;
  });

  const usable=numbers.filter(function(value){return value!==null;});
  if(!usable.length) return cabins.map(function(){return '';});

  const best=modes[key]==='min'
    ? Math.min.apply(null,usable)
    : Math.max.apply(null,usable);

  return numbers.map(function(value){
    return value===best?'compare-best':'';
  });
}

function confirmRemoveRental_(cabinId){
  if(!canRemoveRentals_()){
    closeModal();
    toast('Only the Justin traveler profile can remove rentals.',true);
    return;
  }

  const index=(DATA.cabins||[]).findIndex(function(item){
    return item['Cabin ID']===cabinId;
  });

  const previous=index>=0 ? DATA.cabins[index] : null;

  if(index>=0){
    DATA.cabins.splice(index,1);
  }

  rentalComparisonIds_.delete(cabinId);
  closeModal();
  render();
  toast('Rental removed. Saving in the background…');

  google.script.run
    .withSuccessHandler(function(result){
      toast(result.message||'Rental removed.');
    })
    .withFailureHandler(function(error){
      if(previous){
        DATA.cabins.splice(
          Math.min(index,DATA.cabins.length),
          0,
          previous
        );
        render();
      }

      toast(
        'The rental could not be removed: '+
        (error&&error.message?error.message:String(error)),
        true
      );
    })
    .removeRentalForOrganizer(cabinId,currentTravelerId);
}

  if(url.includes('vrbo.')) return 'Vrbo';
  if(url.includes('airbnb.')) return 'Airbnb';
  if(url.includes('booking.')) return 'Booking.com';
  if(url.includes('expedia.')) return 'Expedia';
  return 'original listing';
}

  document.querySelectorAll('.rental-card').forEach(function(card){
    const matchesSearch=
      !search || String(card.dataset.search||'').includes(search);

    const matchesAmenity=
      !amenity || String(card.dataset.amenities||'').includes(amenity);

    const reviewed=card.dataset.reviewed==='yes';
    const myRating=Number(card.dataset.myRating||0);

    const matchesReviewStatus=
      !reviewStatus ||
      (reviewStatus==='reviewed'&&reviewed) ||
      (reviewStatus==='unreviewed'&&!reviewed);

    const matchesMyRating=
      !myRatingFilter ||
      (myRatingFilter===5&&myRating===5) ||
      (myRatingFilter===4&&myRating>=4) ||
      (myRatingFilter===3&&myRating>=3) ||
      (myRatingFilter===2&&myRating>0&&myRating<=2);

    const matchesBedrooms=
      Number(card.dataset.bedrooms||0) >= minBedrooms;

    const matchesReviews=
      Number(card.dataset.reviews||0) >= minReviews;

    const matchesRating=
      Number(card.dataset.rating||0) >= minRating;

    const totalPrice=Number(card.dataset.totalPrice||0);
    const nightlyPrice=Number(card.dataset.nightlyPrice||0);

    const matchesTotal=
      !maxTotal || (totalPrice > 0 && totalPrice <= maxTotal);

    const matchesNightly=
      !maxNightly || (nightlyPrice > 0 && nightlyPrice <= maxNightly);

    const show=
      matchesSearch &&
      matchesAmenity &&
      matchesReviewStatus &&
      matchesMyRating &&
      matchesBedrooms &&
      matchesReviews &&
      matchesRating &&
      matchesTotal &&
      matchesNightly;

    card.classList.toggle('hidden',!show);
    if(show) visible++;
  });

  const count=document.getElementById('rentalVisibleCount');
  if(count){
    count.textContent=
      visible+' rental'+(visible===1?'':'s')+' shown';
  }
}

function sortablePrice_(value){
  const number=Number(value||0);
  return number>0 ? number : Number.MAX_SAFE_INTEGER;
}

function sortRentals(saveState){
  if(saveState!==false){
    captureRentalFilterState_();
  }

  const sortElement=document.getElementById('rentalSort');
  if(!sortElement) return;

  const mode=sortElement.value;
  const grid=document.getElementById('rentalGrid');
  Array.from(grid.querySelectorAll('.rental-card')).sort(function(a,b){
    if(mode==='myrating') return Number(b.dataset.myRating)-Number(a.dataset.myRating);
    if(mode==='reviewprogress') return Number(b.dataset.reviewProgress)-Number(a.dataset.reviewProgress);
    if(mode==='favorites') return Number(b.dataset.favorites)-Number(a.dataset.favorites);
    if(mode==='comments') return Number(b.dataset.comments)-Number(a.dataset.comments);
    if(mode==='price'){
      return sortablePrice_(a.dataset.totalPrice)-sortablePrice_(b.dataset.totalPrice);
    }
    if(mode==='nightly'){
      return sortablePrice_(a.dataset.nightlyPrice)-sortablePrice_(b.dataset.nightlyPrice);
    }
    if(mode==='reviews') return Number(b.dataset.reviews)-Number(a.dataset.reviews);
    if(mode==='rating') return Number(b.dataset.rating)-Number(a.dataset.rating);
    if(mode==='bedrooms') return Number(b.dataset.bedrooms)-Number(a.dataset.bedrooms);
    if(mode==='sleeps') return Number(b.dataset.sleeps)-Number(a.dataset.sleeps);
    if(mode==='newest') return String(b.dataset.created).localeCompare(String(a.dataset.created));
    return Number(b.dataset.score)-Number(a.dataset.score);
  }).forEach(function(card){grid.appendChild(card);});
}

function deriveClientCabinFeatures_(c){
  const values=lines(c.Amenities).concat([
    c['Cabin Name']||'',
    c.Description||''
  ]);

  function find(patterns){
    for(const pattern of patterns){
      const match=values.find(function(value){
        return pattern.test(String(value||''));
      });
      if(match) return match;
    }
    return '';
  }

  return {
    pool:find([/\bprivate\b.*\bpool\b/i,/\bindoor\b.*\bpool\b/i,/\bheated\b.*\bpool\b/i,/\bpool\b/i]),
    hotTub:find([/\bhot tubs?\b/i,/\bspa\b/i,/\bjacuzzi\b/i]),
    theater:find([/\bhome theater\b/i,/\bmovie theater\b/i,/\btheatre\b/i,/\bcinema\b/i]),
    arcade:find([/\barcade\b/i,/\bgame room\b/i,/\bgames galore\b/i,/\bpool table\b/i,/\bfoosball\b/i,/\bair hockey\b/i])
  };
}

      if(!target) return;

      const index=(target.comments||[]).findIndex(function(item){

  const reasons=Array.from(
    document.querySelectorAll('input[name="voteReason"]:checked')
  ).map(function(input){return input.value;});

  const round=currentVotingRound_();
  const previousVote=myVoteForCabin_(cabinId);

  const optimisticVote={
    'Vote ID':previousVote?previousVote['Vote ID']:'LOCAL-'+Date.now(),
    'Cabin ID':cabinId,
    'Traveler ID':currentTravelerId,
    'Score':score,
    'Notes':val('voteNotes'),

      document.getElementById('voteFirstChoice') &&
      document.getElementById('voteFirstChoice').checked
    )?'Yes':'',

  };

  DATA.votes=(DATA.votes||[]).filter(function(vote){
    return !(
      vote['Cabin ID']===cabinId &&
      vote['Traveler ID']===currentTravelerId &&
      String(vote['Voting Round']||'Preliminary')===round
    );
  });
  DATA.votes.push(optimisticVote);

  const cabin=DATA.cabins.find(function(item){
    return item['Cabin ID']===cabinId;
  });

  if(cabin){
    const votes=currentRoundVotesForCabin_(cabinId);
    cabin.voteCount=votes.length;
    cabin.averageScore=votes.length
      ? votes.reduce(function(total,vote){
          return total+Number(vote.Score||0);
        },0)/votes.length
      : 0;
  }

  closeModal();
  render();
  toast(previousVote?'Rating updated. Saving…':'Rating saved. Syncing…');

  google.script.run
    .withSuccessHandler(function(result){
      DATA.votes=(DATA.votes||[]).filter(function(vote){
        return !(
          vote['Cabin ID']===cabinId &&
          vote['Traveler ID']===currentTravelerId &&
          String(vote['Voting Round']||'Preliminary')===round
        );
      });
      DATA.votes.push(result.vote);

        cabin.voteCount=result.voteCount;
        cabin.averageScore=result.averageScore;

      render();
      toast(result.message||'Rating saved.');
    })
    .withFailureHandler(function(error){
      DATA.votes=(DATA.votes||[]).filter(function(vote){
        return !(
          vote['Cabin ID']===cabinId &&
          vote['Traveler ID']===currentTravelerId &&
          String(vote['Voting Round']||'Preliminary')===round
        );
      });

      if(previousVote) DATA.votes.push(previousVote);
      render();

      toast(
        'Rating could not be saved: '+
        (error&&error.message?error.message:String(error)),
        true
      );
    })
    .saveVoteFast({
      cabinId:cabinId,
      travelerId:currentTravelerId,
      score:score,
      notes:val('voteNotes'),
      reasons:reasons,
      firstChoice:(
        round==='Final' &&
        document.getElementById('voteFirstChoice') &&
        document.getElementById('voteFirstChoice').checked
      ),
      round:round
    });
}

function toggleFavorite(cabinId){
  requireTraveler();
  run('toggleFavorite',[cabinId,currentTravelerId],'Favorite updated.',false);
}
</script>
