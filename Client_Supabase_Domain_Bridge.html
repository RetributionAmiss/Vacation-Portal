<script>
/*
 * Controlled Supabase runtime cutover bridge.
 *
 * The Apps Script iframe never receives Supabase session tokens. It asks the
 * top-level PWA shell for allow-listed domain operations. Supabase is now the
 * primary Travel read source. Sheets remains the authoritative mutation path;
 * successful Sheets saves/deletes are mirrored to Supabase and compared.
 * If a primary Supabase read is unavailable, the bridge falls back to Sheets.
 */
(function installSupabaseTravelReadBridge_(){
  if(typeof p3TravelArrivalLoad_!=='function') return;
  if(window.__vacationSupabaseTravelReadBridgeInstalled) return;
  window.__vacationSupabaseTravelReadBridgeInstalled=true;

  const REQUEST_TYPE='vacation-portal-supabase-domain-request';
  const RESPONSE_TYPE='vacation-portal-supabase-domain-response';
  const OP_READ_TRAVEL='travelPlans.read';
  const OP_UPSERT_TRAVEL='travelPlans.upsert';
  const OP_DELETE_TRAVEL='travelPlans.delete';
  const REQUEST_TIMEOUT_MS=5500;
  const READ_TTL_MS=15000;
  const pending={};
  const legacyTravelLoad=p3TravelArrivalLoad_;
  const legacyTravelSave=typeof p3TravelArrivalSave_==='function'?p3TravelArrivalSave_:null;
  const legacyTravelDelete=typeof p3TravelArrivalDeleteNow_==='function'?p3TravelArrivalDeleteNow_:null;
  let readRequestInFlight=false;
  let lastReadRequestAt=0;
  let shadowStatusAnnounced=false;
  let primaryStatusAnnounced=false;

  function requestId_(){
    return 'supa-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
  }

  function hostTargets_(){
    const targets=[];
    try{
      if(window.parent&&window.parent!==window) targets.push(window.parent);
    }catch(error){}
    try{
      if(window.top&&window.top!==window&&targets.indexOf(window.top)===-1) targets.push(window.top);
    }catch(error){}
    return targets;
  }

  function request_(operation,data){
    return new Promise(function(resolve,reject){
      const targets=hostTargets_();
      if(!targets.length){
        const error=new Error('Supabase PWA bridge is unavailable.');
        error.code='bridge_no_host';
        reject(error);
        return;
      }

      const id=requestId_();
      const timer=setTimeout(function(){
        delete pending[id];
        const error=new Error('Supabase PWA bridge timed out.');
        error.code='bridge_timeout';
        reject(error);
      },REQUEST_TIMEOUT_MS);

      pending[id]={
        resolve:function(value){clearTimeout(timer);resolve(value);},
        reject:function(error){clearTimeout(timer);reject(error);}
      };

      const payload={
        type:REQUEST_TYPE,
        requestId:id,
        operation:operation,
        data:data||{}
      };

      // Apps Script HTML Service runs the user page inside its own sandbox
      // iframe. In the installed PWA that can put a Google wrapper between this
      // page and the GitHub shell, so send to both the immediate parent and the
      // top window. The PWA host validates the nested Apps Script origin.
      targets.forEach(function(target){
        try{target.postMessage(payload,'*');}catch(error){}
      });
    });
  }

  function comparablePlan_(row){
    row=row||{};
    return {
      id:String(row['Travel Plan ID']||''),
      travelerId:String(row['Traveler ID']||''),
      mode:String(row.Mode||''),
      leavingFrom:String(row['Leaving From']||''),
      departureDate:String(row['Departure Date']||'').slice(0,10),
      departureTime:String(row['Departure Time']||'').slice(0,5),
      arrivalDate:String(row['Arrival Date']||'').slice(0,10),
      arrivalTime:String(row['Arrival Time']||'').slice(0,5),
      details:String(row['Travel Details']||''),
      notes:String(row.Notes||'')
    };
  }

  function comparablePlans_(rows){
    return (rows||[])
      .map(comparablePlan_)
      .sort(function(a,b){return (a.id+'|'+a.travelerId).localeCompare(b.id+'|'+b.travelerId);});
  }

  function plansMatchSheets_(supabasePlans){
    const sheetJson=JSON.stringify(comparablePlans_(DATA.travelPlans||[]));
    const supabaseJson=JSON.stringify(comparablePlans_(supabasePlans||[]));
    return sheetJson===supabaseJson;
  }

  function announceShadowStatus_(status,code){
    if(shadowStatusAnnounced||currentView!=='travel'||typeof toast!=='function') return;
    shadowStatusAnnounced=true;
    if(status==='sheets+supabase-shadow-match'){
      toast('Supabase Travel check passed — data matches Sheets.');
      return;
    }
    if(status==='sheets+supabase-shadow-mismatch'){
      toast('Supabase Travel check found a difference. Sheets is still being used.',true);
      return;
    }
    if(status==='sheets+supabase-shadow-unavailable'){
      const suffix=code?' ('+String(code)+')':'';
      toast('Supabase Travel check was unavailable'+suffix+'. Sheets is still being used.',true);
    }
  }

  function announcePrimaryReadStatus_(){
    if(primaryStatusAnnounced||currentView!=='travel'||typeof toast!=='function') return;
    primaryStatusAnnounced=true;
    toast('Supabase Travel primary read passed — loaded from Supabase.');
  }

  function announcePrimaryFallback_(code){
    if(currentView!=='travel'||typeof toast!=='function') return;
    const suffix=code?' ('+String(code)+')':'';
    toast('Supabase Travel read was unavailable'+suffix+'. Using Sheets fallback.',true);
  }

  function recordShadowComparison_(supabasePlans,attempt){
    attempt=Number(attempt||0);
    if(p3TravelArrivalState_.loading&&attempt<40){
      setTimeout(function(){recordShadowComparison_(supabasePlans,attempt+1);},100);
      return;
    }

    DATA.supabaseTravelShadowPlans=(supabasePlans||[]).map(function(row){return Object.assign({},row);});
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};

    const status=plansMatchSheets_(supabasePlans)
      ? 'sheets+supabase-shadow-match'
      : 'sheets+supabase-shadow-mismatch';
    DATA.supabaseDomainSources.travelPlans=status;
    announceShadowStatus_(status);
  }

  function announceMutationStatus_(action,status,code){
    if(currentView!=='travel'||typeof toast!=='function') return;
    const label=action==='delete'?'delete':'save';
    if(status==='sheets+supabase-shadow-write-match'){
      toast('Supabase Travel '+label+' check passed — data matches Sheets.');
      return;
    }
    if(status==='sheets+supabase-shadow-write-mismatch'){
      toast('Supabase Travel '+label+' check found a difference. Sheets is still primary.',true);
      return;
    }
    const suffix=code?' ('+String(code)+')':'';
    toast('Supabase Travel '+label+' check was unavailable'+suffix+'. Sheets saved successfully.',true);
  }

  function recordMutationComparison_(action,supabasePlans){
    DATA.supabaseTravelShadowPlans=(supabasePlans||[]).map(function(row){return Object.assign({},row);});
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};

    const status=plansMatchSheets_(supabasePlans)
      ? 'sheets+supabase-shadow-write-match'
      : 'sheets+supabase-shadow-write-mismatch';
    DATA.supabaseDomainSources.travelPlans=status;
    delete DATA.supabaseDomainDiagnostics.travelPlans;
    announceMutationStatus_(action,status);
  }

  function recordMutationFailure_(action,error){
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    DATA.supabaseDomainSources.travelPlans='sheets+supabase-shadow-write-unavailable';
    DATA.supabaseDomainDiagnostics.travelPlans={
      operation:action,
      code:String(error&&error.code||'bridge_error'),
      message:String(error&&error.message||'Supabase domain request failed.')
    };
    announceMutationStatus_(
      action,
      'sheets+supabase-shadow-write-unavailable',
      DATA.supabaseDomainDiagnostics.travelPlans.code
    );
  }

  window.addEventListener('message',function(event){
    const data=event&&event.data||{};
    if(data.type!==RESPONSE_TYPE) return;
    if(event.source!==window.parent&&event.source!==window.top) return;
    const id=String(data.requestId||'');
    const waiter=pending[id];
    if(!waiter) return;
    delete pending[id];

    if(data.ok){
      waiter.resolve(data.data||{});
      return;
    }

    const error=new Error(
      data.error&&data.error.message
        ? String(data.error.message)
        : 'Supabase domain request failed.'
    );
    error.code=String(data.error&&data.error.code||'bridge_error');
    waiter.reject(error);
  });

  // Called only after an authoritative Sheets mutation has settled. A failed
  // mirror never rolls back or blocks the user's Sheets save/delete.
  window.p3TravelArrivalShadowWrite_=function(action,plan){
    const normalizedAction=action==='delete'?'delete':'upsert';
    const operation=normalizedAction==='delete'?OP_DELETE_TRAVEL:OP_UPSERT_TRAVEL;
    request_(operation,{plan:plan||{}})
      .then(function(result){
        recordMutationComparison_(normalizedAction,(result&&result.plans)||[]);
      })
      .catch(function(error){
        recordMutationFailure_(normalizedAction,error);
      });
  };

  function waitForTravelMutation_(travelerId,callback,attempt){
    attempt=Number(attempt||0);
    if(!p3TravelArrivalPendingFor_(travelerId)){
      callback();
      return;
    }
    if(attempt>=80) return;
    setTimeout(function(){waitForTravelMutation_(travelerId,callback,attempt+1);},100);
  }

  if(legacyTravelSave){
    p3TravelArrivalSave_=function(event){
      const travelerId=p3TravelArrivalSelfId_();
      const before=p3TravelArrivalPlanFor_(travelerId);
      const beforeComparable=before?JSON.stringify(comparablePlan_(before)):'';
      const wasPending=travelerId?p3TravelArrivalPendingFor_(travelerId):false;
      const result=legacyTravelSave.apply(this,arguments);
      if(!travelerId||wasPending||!p3TravelArrivalPendingFor_(travelerId)) return result;

      waitForTravelMutation_(travelerId,function(){
        const settled=p3TravelArrivalPlanFor_(travelerId);
        if(!settled) return;
        if(String(settled['Travel Plan ID']||'').indexOf('LOCAL-TRAVEL-')===0) return;
        const settledComparable=JSON.stringify(comparablePlan_(settled));
        if(beforeComparable&&beforeComparable===settledComparable) return;
        window.p3TravelArrivalShadowWrite_('upsert',settled);
      },0);
      return result;
    };
  }

  if(legacyTravelDelete){
    p3TravelArrivalDeleteNow_=function(){
      const travelerId=p3TravelArrivalSelfId_();
      const before=p3TravelArrivalPlanFor_(travelerId);
      const wasPending=travelerId?p3TravelArrivalPendingFor_(travelerId):false;
      const result=legacyTravelDelete.apply(this,arguments);
      if(!travelerId||!before||wasPending||!p3TravelArrivalPendingFor_(travelerId)) return result;

      waitForTravelMutation_(travelerId,function(){
        const settled=p3TravelArrivalPlanFor_(travelerId);
        if(settled) return;
        window.p3TravelArrivalShadowWrite_('delete',before);
      },0);
      return result;
    };
  }

  p3TravelArrivalLoad_=function(force){
    if(readRequestInFlight) return;
    if(!force&&lastReadRequestAt&&Date.now()-lastReadRequestAt<READ_TTL_MS) return;

    readRequestInFlight=true;
    lastReadRequestAt=Date.now();
    p3TravelArrivalState_.loading=true;

    // Supabase is queried first. In the promoted stage a successful response is
    // the only visible Travel read. If the release flag is rolled back to
    // shadow mode, or if the Supabase request fails, the legacy Sheets loader
    // remains available as the explicit fallback path.
    request_(OP_READ_TRAVEL)
      .then(function(result){
        const plans=(result&&result.plans)||[];
        if(result&&result.primary===true){
          DATA.travelPlans=plans;
          DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
          DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
          DATA.supabaseDomainSources.travelPlans='supabase-primary';
          delete DATA.supabaseDomainDiagnostics.travelPlans;
          p3TravelArrivalState_.loaded=true;
          p3TravelArrivalState_.loading=false;
          p3TravelArrivalState_.lastLoaded=Date.now();
          announcePrimaryReadStatus_();
          if(currentView==='travel'||currentView==='dashboard') render();
          return;
        }

        // Config rollback path: preserve the previously validated shadow-read
        // behavior without requiring an Apps Script redeploy.
        p3TravelArrivalState_.loading=false;
        legacyTravelLoad.call(window,force);
        recordShadowComparison_(plans,0);
      })
      .catch(function(error){
        DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
        DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
        DATA.supabaseDomainSources.travelPlans='supabase-primary-fallback-sheets';
        DATA.supabaseDomainDiagnostics.travelPlans={
          code:String(error&&error.code||'bridge_error'),
          message:String(error&&error.message||'Supabase domain request failed.')
        };
        p3TravelArrivalState_.loading=false;
        announcePrimaryFallback_(DATA.supabaseDomainDiagnostics.travelPlans.code);
        legacyTravelLoad.call(window,true);
      })
      .then(function(){
        readRequestInFlight=false;
      },function(){
        readRequestInFlight=false;
      });
  };
})();
</script>
