<script>
(function installFinalizedRentalSupabaseShadow_(){
  const REQUEST_TYPE='vacation-portal-supabase-rentals-request';
  const RESPONSE_TYPE='vacation-portal-supabase-domain-response';
  const OP_READ='finalizedRental.read';
  const RESPONSE_TIMEOUT_MS=8000;
  const RETRY_DELAY_MS=1500;
  const BADGE_ID='supabase-finalized-rental-shadow-test-badge';
  const pending={};
  let completedFingerprint='';
  let inFlightFingerprint='';
  let retryNotBefore=0;
  let requestSequence=0;

  const COMPARE_FIELDS=[
    'Cabin ID','Provider','Provider Property ID','Cabin Name','Nickname',
    'Rental URL','Original Rental URL','Location','Sleeps','Bedrooms','Bathrooms',
    'Total Rental Cost','Nightly Rate','Rating','Review Count','Image URL',
    'Description','Cancellation Policy','Fees and Taxes','House Rules','Parking',
    'Accessibility','Nearby Highlights','Import Stage','Import Confidence','Status','Active'
  ];
  const NUMBER_FIELDS={
    'Sleeps':true,'Bedrooms':true,'Bathrooms':true,'Total Rental Cost':true,
    'Nightly Rate':true,'Rating':true,'Review Count':true,'Import Confidence':true
  };

  function ensureBadge_(){
    if(!document.body) return null;
    let badge=document.getElementById(BADGE_ID);
    if(badge) return badge;

    badge=document.createElement('div');
    badge.id=BADGE_ID;
    badge.setAttribute('role','status');
    badge.setAttribute('aria-live','polite');
    badge.style.cssText=[
      'position:fixed',
      'right:12px',
      'bottom:12px',
      'z-index:2147483646',
      'display:flex',
      'align-items:center',
      'gap:8px',
      'padding:7px 10px',
      'border-radius:999px',
      'border:1px solid rgba(255,255,255,.22)',
      'background:rgba(20,26,23,.94)',
      'box-shadow:0 8px 26px rgba(0,0,0,.28)',
      'color:#f7f3e8',
      'font:700 10px/1.2 Arial,sans-serif',
      'letter-spacing:.08em',
      'text-transform:uppercase',
      'pointer-events:none'
    ].join(';');
    badge.innerHTML='<span style="opacity:.72">Rental shadow</span><strong data-shadow-state>CHECKING</strong>';
    document.body.appendChild(badge);
    return badge;
  }

  function setBadge_(status,detail){
    const badge=ensureBadge_();
    if(!badge) return;
    const state=badge.querySelector('[data-shadow-state]');
    const normalized=String(status||'checking').toLowerCase();
    const palette={
      checking:{text:'CHECKING',color:'#f3cf78',border:'rgba(243,207,120,.55)'},
      match:{text:'MATCH',color:'#8de0ae',border:'rgba(141,224,174,.55)'},
      mismatch:{text:'MISMATCH',color:'#ff9a8f',border:'rgba(255,154,143,.6)'},
      unavailable:{text:'UNAVAILABLE',color:'#ffbd7a',border:'rgba(255,189,122,.58)'}
    };
    const style=palette[normalized]||palette.checking;
    badge.dataset.status=normalized;
    badge.style.borderColor=style.border;
    if(state){
      state.textContent=style.text;
      state.style.color=style.color;
    }
    badge.title=String(detail||'Finalized rental Supabase shadow test.');
  }

  function selectedFinalizedCabin_(){
    if(!window.DATA||!DATA.trip) return null;
    const trip=DATA.trip||{};
    const selected=String(trip['Selected Cabin ID']||DATA.finalizedRentalId||'').trim();
    const stage=String(trip['Portal Stage']||'').trim();
    const closedFlag=String(trip['Final Voting Closed']||'No').trim().toLowerCase()==='yes';
    const focused=Boolean(DATA.finalizedRentalOnly&&DATA.finalizedRentalId);
    if(!selected||!(closedFlag||stage==='Voting Closed'||focused)) return null;
    return (DATA.cabins||[]).find(function(cabin){
      return String(cabin&&cabin['Cabin ID']||'').trim()===selected;
    })||null;
  }

  function normalize_(field,value){
    if(NUMBER_FIELDS[field]){
      const number=Number(value||0);
      return isFinite(number)?Math.round(number*100)/100:0;
    }
    if(field==='Active'){
      const active=String(value===null||value===undefined?'':value).trim().toLowerCase();
      if(!active||active==='yes'||active==='true'||active==='1'||active==='on') return 'Yes';
      if(active==='no'||active==='false'||active==='0'||active==='off') return 'No';
      return active;
    }
    return String(value===null||value===undefined?'':value).replace(/\r\n/g,'\n').trim();
  }

  function compare_(sheetRental,supabaseRental){
    const mismatches=[];
    COMPARE_FIELDS.forEach(function(field){
      const sheetValue=normalize_(field,sheetRental&&sheetRental[field]);
      const supabaseValue=normalize_(field,supabaseRental&&supabaseRental[field]);
      if(sheetValue!==supabaseValue){
        mismatches.push({field:field,sheet:sheetValue,supabase:supabaseValue});
      }
    });
    return mismatches;
  }

  function setUnavailable_(legacyId,errorCode,errorMessage){
    DATA.supabaseFinalizedRentalShadow={
      status:'unavailable',
      legacyId:String(legacyId||''),
      errorCode:String(errorCode||'shadow_read_failed'),
      error:String(errorMessage||'Supabase finalized-rental shadow read failed.')
    };
    setBadge_('unavailable',DATA.supabaseFinalizedRentalShadow.error);
    console.warn('Supabase finalized-rental shadow unavailable.',DATA.supabaseFinalizedRentalShadow);
  }

  function finishPending_(requestId,markCompleted){
    const owned=pending[requestId];
    if(!owned) return null;
    if(owned.timeoutId) clearTimeout(owned.timeoutId);
    delete pending[requestId];
    if(inFlightFingerprint===owned.fingerprint) inFlightFingerprint='';
    if(markCompleted) completedFingerprint=owned.fingerprint;
    return owned;
  }

  function requestShadow_(cabin){
    const legacyId=String(cabin&&cabin['Cabin ID']||'').trim();
    if(!legacyId) return;
    const fingerprint=COMPARE_FIELDS.map(function(field){
      return field+'='+String(normalize_(field,cabin[field]));
    }).join('|');
    if(fingerprint===completedFingerprint||inFlightFingerprint||Date.now()<retryNotBefore) return;

    const requestId='finalized-rental-shadow-'+Date.now().toString(36)+'-'+(++requestSequence).toString(36);
    inFlightFingerprint=fingerprint;
    pending[requestId]={legacyId:legacyId,sheetRental:cabin,fingerprint:fingerprint,timeoutId:null};
    setBadge_('checking','Comparing Sheets with the Supabase finalized-rental shadow for '+legacyId+'.');
    pending[requestId].timeoutId=setTimeout(function(){
      const owned=finishPending_(requestId,false);
      if(!owned) return;
      retryNotBefore=Date.now()+RETRY_DELAY_MS;
      setUnavailable_(
        owned.legacyId,
        'shadow_bridge_timeout',
        'Timed out waiting for the Supabase finalized-rental shadow bridge. The check will retry.'
      );
    },RESPONSE_TIMEOUT_MS);

    try{
      window.top.postMessage({
        type:REQUEST_TYPE,
        requestId:requestId,
        operation:OP_READ,
        legacyId:legacyId
      },'*');
    }catch(error){
      const owned=finishPending_(requestId,false);
      retryNotBefore=Date.now()+RETRY_DELAY_MS;
      setUnavailable_(
        owned&&owned.legacyId||legacyId,
        'bridge_post_failed',
        String(error&&error.message||error||'bridge_post_failed')
      );
    }
  }

  window.addEventListener('message',function(event){
    const data=event&&event.data||{};
    if(data.type!==RESPONSE_TYPE) return;

    const requestId=String(data.requestId||'');
    const owned=pending[requestId];
    if(!owned) return;
    finishPending_(requestId,true);

    // This shadow layer is diagnostics-only. It never mutates DATA.cabins,
    // never changes the selected cabin, and never changes render authority.
    if(!data.ok){
      setUnavailable_(
        owned.legacyId,
        String(data.error&&data.error.code||'shadow_read_failed'),
        String(data.error&&data.error.message||'Supabase finalized-rental shadow read failed.')
      );
      return;
    }

    const result=data.data||{};
    const mismatches=compare_(owned.sheetRental,result.rental||{});
    DATA.supabaseFinalizedRentalShadow={
      status:mismatches.length?'mismatch':'match',
      source:String(result.source||'supabase-shadow'),
      primary:false,
      legacyId:owned.legacyId,
      mismatchCount:mismatches.length,
      mismatches:mismatches,
      checkedAt:new Date().toISOString()
    };

    if(mismatches.length){
      setBadge_('mismatch',mismatches.length+' finalized-rental field mismatch'+(mismatches.length===1?'':'es')+'.');
      console.warn('Supabase finalized-rental shadow mismatch.',DATA.supabaseFinalizedRentalShadow);
    }else{
      setBadge_('match','Supabase finalized-rental shadow matches Sheets for '+owned.legacyId+'.');
      console.info('Supabase finalized-rental shadow matches Sheets for '+owned.legacyId+'.');
    }
  });

  function check_(){
    const cabin=selectedFinalizedCabin_();
    if(cabin) requestShadow_(cabin);
  }

  // Stay outside the render/data authority chain. Polling a tiny in-memory
  // fingerprint avoids wrapping render(), loadDeferredPortalData_(), or any
  // accepted Supabase primary bridge. A lost startup message times out and
  // retries so bridge/module load order cannot leave the shadow permanently pending.
  setInterval(check_,1500);
  setTimeout(check_,0);
})();
</script>
