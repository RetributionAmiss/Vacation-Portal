<script>
/* Guarded Itinerary read cutover. Sheets is loaded first as the rollback source,
 * then an authenticated Supabase response becomes the visible Itinerary source
 * when the release flag marks it primary. Sheets remains authoritative for all
 * Itinerary mutations and is restored explicitly if a primary read is unavailable. */
(function installSupabaseItineraryBridge_(){
  if(window.__vacationSupabaseItineraryBridgeInstalled) return;
  if(typeof p2PlannerEnsureSocialData_!=='function') return;
  window.__vacationSupabaseItineraryBridgeInstalled=true;

  const REQUEST_TYPE='vacation-portal-supabase-itinerary-request';
  const RESPONSE_TYPE='vacation-portal-supabase-domain-response';
  const OP_READ='itinerary.read';
  const REQUEST_TIMEOUT_MS=5500;
  const READ_TTL_MS=15000;
  const pending={};
  const legacyEnsure=p2PlannerEnsureSocialData_;
  let readInFlight=false;
  let lastReadAt=0;
  let statusAnnounced=false;
  let primaryStatusAnnounced=false;
  let sheetsReadinessInFlight=false;

  function requestId_(){
    return 'supa-itin-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
  }

  function hostTargets_(){
    const targets=[];
    try{if(window.parent&&window.parent!==window) targets.push(window.parent);}catch(error){}
    try{if(window.top&&window.top!==window&&targets.indexOf(window.top)===-1) targets.push(window.top);}catch(error){}
    return targets;
  }

  function request_(){
    return new Promise(function(resolve,reject){
      const targets=hostTargets_();
      if(!targets.length){
        const error=new Error('Supabase PWA bridge is unavailable.');
        error.code='bridge_no_host';
        error.primary=true;
        reject(error);
        return;
      }
      const id=requestId_();
      const timer=setTimeout(function(){
        delete pending[id];
        const error=new Error('Supabase PWA bridge timed out.');
        error.code='bridge_timeout';
        error.primary=true;
        reject(error);
      },REQUEST_TIMEOUT_MS);
      pending[id]={
        resolve:function(value){clearTimeout(timer);resolve(value);},
        reject:function(error){clearTimeout(timer);reject(error);}
      };
      const payload={type:REQUEST_TYPE,requestId:id,operation:OP_READ,data:{}};
      targets.forEach(function(target){try{target.postMessage(payload,'*');}catch(error){}});
    });
  }

  function date_(value){
    const match=String(value||'').trim().match(/^(\d{4}-\d{2}-\d{2})/);
    return match?match[1]:'';
  }

  function time_(value){
    const match=String(value||'').trim().match(/^(\d{1,2}):(\d{2})/);
    if(!match) return '';
    return String(Number(match[1])).padStart(2,'0')+':'+match[2];
  }

  function number_(value){
    const n=Number(value||0);
    return isFinite(n)?Math.round(n*100)/100:0;
  }

  function itinerary_(rows){
    return (rows||[]).map(function(row){
      return {
        id:String(row['Itinerary ID']||''),
        date:date_(row.Date),
        start:time_(row['Start Time']),
        end:time_(row['End Time']),
        activity:String(row.Activity||'').trim(),
        location:String(row.Location||'').trim(),
        eventUrl:String(row['Event URL']||'').trim(),
        assignedTo:String(row['Assigned To']||'').trim(),
        cost:number_(row.Cost),
        costPer:String(row['Cost Per']||'').trim(),
        notes:String(row.Notes||'').trim()
      };
    }).sort(function(a,b){return (a.id+'|'+a.date+'|'+a.start).localeCompare(b.id+'|'+b.date+'|'+b.start);});
  }

  function signups_(rows){
    return (rows||[]).map(function(row){
      return {
        id:String(row['Signup ID']||''),
        itineraryId:String(row['Itinerary ID']||''),
        travelerId:String(row['Traveler ID']||''),
        plannedDate:date_(row['Planned Date']),
        plannedTime:time_(row['Planned Time'])
      };
    }).sort(function(a,b){return (a.id+'|'+a.itineraryId+'|'+a.travelerId).localeCompare(b.id+'|'+b.itineraryId+'|'+b.travelerId);});
  }

  function comments_(rows){
    return (rows||[]).filter(function(row){
      return String(row['Planner Type']||'')==='Itinerary';
    }).map(function(row){
      return {
        id:String(row['Planner Comment ID']||''),
        itemId:String(row['Item ID']||''),
        travelerId:String(row['Traveler ID']||''),
        travelerName:String(row['Traveler Name']||row.travelerName||'').trim(),
        comment:String(row.Comment||'').trim()
      };
    }).sort(function(a,b){return (a.id+'|'+a.itemId+'|'+a.travelerId).localeCompare(b.id+'|'+b.itemId+'|'+b.travelerId);});
  }

  function comparableBundle_(itineraryRows,signupRows,commentRows){
    return JSON.stringify({
      itinerary:itinerary_(itineraryRows),
      signups:signups_(signupRows),
      comments:comments_(commentRows)
    });
  }

  function firstChangedField_(a,b){
    const keys=Object.keys(Object.assign({},a||{},b||{})).filter(function(key){return key!=='id';});
    for(let i=0;i<keys.length;i++){
      const key=keys[i];
      if(JSON.stringify(a&&a[key])!==JSON.stringify(b&&b[key])) return key;
    }
    return 'row';
  }

  function sectionDiff_(label,sheetsRows,supabaseRows){
    const left=Array.isArray(sheetsRows)?sheetsRows:[];
    const right=Array.isArray(supabaseRows)?supabaseRows:[];
    const leftById={};
    const rightById={};
    left.forEach(function(row){leftById[String(row&&row.id||'')]=row;});
    right.forEach(function(row){rightById[String(row&&row.id||'')]=row;});
    const ids=Array.from(new Set(Object.keys(leftById).concat(Object.keys(rightById)))).sort();
    let first=null;
    let differenceCount=0;

    ids.forEach(function(id){
      const a=leftById[id];
      const b=rightById[id];
      if(!a||!b){
        differenceCount++;
        if(!first){
          first={id:id,reason:!b?'missing in Supabase':'missing in Sheets'};
        }
        return;
      }
      if(JSON.stringify(a)!==JSON.stringify(b)){
        differenceCount++;
        if(!first){
          first={id:id,reason:'field '+firstChangedField_(a,b)};
        }
      }
    });

    if(left.length!==right.length&&differenceCount===0){
      differenceCount=Math.abs(left.length-right.length)||1;
      first={id:'',reason:'row count'};
    }

    return {
      label:label,
      sheetsCount:left.length,
      supabaseCount:right.length,
      matches:differenceCount===0,
      differenceCount:differenceCount,
      first:first
    };
  }

  function mismatchMessage_(diffs){
    const mismatches=diffs.filter(function(diff){return !diff.matches;});
    const parts=diffs.map(function(diff){
      return diff.label+' '+diff.sheetsCount+'/'+diff.supabaseCount+(diff.matches?' match':' differ');
    });
    let detail='';
    if(mismatches.length&&mismatches[0].first){
      const first=mismatches[0].first;
      detail=' First: '+mismatches[0].label+(first.id?' '+first.id:'')+' · '+first.reason+'.';
    }
    return 'Supabase Itinerary difference — '+parts.join('; ')+'.'+detail+' Sheets is still being used.';
  }

  function storeSupabaseSnapshot_(result){
    DATA.supabaseItineraryShadow={
      itinerary:(result&&result.itinerary)||[],
      itinerarySignups:(result&&result.itinerarySignups)||[],
      plannerComments:(result&&result.plannerComments)||[]
    };
  }

  function recordResult_(result){
    const sheetItinerary=itinerary_((DATA&&DATA.itinerary)||[]);
    const sheetSignups=signups_((DATA&&DATA.itinerarySignups)||[]);
    const sheetComments=comments_((DATA&&DATA.plannerComments)||[]);
    const supaItinerary=itinerary_((result&&result.itinerary)||[]);
    const supaSignups=signups_((result&&result.itinerarySignups)||[]);
    const supaComments=comments_((result&&result.plannerComments)||[]);

    const sheets=comparableBundle_(
      (DATA&&DATA.itinerary)||[],
      (DATA&&DATA.itinerarySignups)||[],
      (DATA&&DATA.plannerComments)||[]
    );
    const supabase=comparableBundle_(
      (result&&result.itinerary)||[],
      (result&&result.itinerarySignups)||[],
      (result&&result.plannerComments)||[]
    );
    const matches=sheets===supabase;
    const diffs=[
      sectionDiff_('activities',sheetItinerary,supaItinerary),
      sectionDiff_('signups',sheetSignups,supaSignups),
      sectionDiff_('comments',sheetComments,supaComments)
    ];

    storeSupabaseSnapshot_(result);
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    DATA.supabaseDomainSources.itinerary=matches
      ?'sheets+supabase-itinerary-shadow-match'
      :'sheets+supabase-itinerary-shadow-mismatch';
    if(matches){
      delete DATA.supabaseDomainDiagnostics.itinerary;
    }else{
      DATA.supabaseDomainDiagnostics.itinerary={
        code:'shadow_mismatch',
        sections:diffs
      };
    }

    if(statusAnnounced||currentView!=='itinerary'||typeof toast!=='function') return;
    statusAnnounced=true;
    if(matches){
      toast('Supabase Itinerary check passed — data matches Sheets.');
    }else{
      toast(mismatchMessage_(diffs),true);
    }
  }

  function recordPrimaryResult_(result){
    if(!DATA) return;

    const nonItineraryComments=((DATA&&DATA.plannerComments)||[]).filter(function(row){
      return String(row['Planner Type']||'')!=='Itinerary';
    });
    const supabaseComments=(result&&result.plannerComments)||[];

    DATA.itinerary=(result&&result.itinerary)||[];
    DATA.itinerarySignups=(result&&result.itinerarySignups)||[];
    DATA.plannerComments=nonItineraryComments.concat(supabaseComments);
    storeSupabaseSnapshot_(result);

    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    DATA.supabaseDomainSources.itinerary='supabase-primary';
    delete DATA.supabaseDomainDiagnostics.itinerary;

    if(typeof p2PlannerSocialState_!=='undefined'&&p2PlannerSocialState_){
      p2PlannerSocialState_.loaded=true;
      p2PlannerSocialState_.loading=false;
      p2PlannerSocialState_.lastLoaded=Date.now();
    }

    if(!primaryStatusAnnounced&&currentView==='itinerary'&&typeof toast==='function'){
      primaryStatusAnnounced=true;
      toast('Supabase Itinerary primary read passed — loaded from Supabase.');
    }

    if(currentView==='itinerary') render();
  }

  function recordFailure_(error){
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    const code=String(error&&error.code||'bridge_error');
    DATA.supabaseDomainSources.itinerary='sheets+supabase-itinerary-shadow-unavailable';
    DATA.supabaseDomainDiagnostics.itinerary={
      code:code,
      message:String(error&&error.message||'Supabase Itinerary read failed.')
    };
    if(statusAnnounced||currentView!=='itinerary'||typeof toast!=='function') return;
    statusAnnounced=true;
    toast('Supabase Itinerary check was unavailable ('+code+'). Sheets is still being used.',true);
  }

  function requestSheetsFallback_(){
    try{
      if(typeof p2PlannerSocialState_!=='undefined'&&p2PlannerSocialState_){
        p2PlannerSocialState_.loaded=false;
        p2PlannerSocialState_.loading=false;
        p2PlannerSocialState_.lastLoaded=0;
      }
    }catch(error){}

    try{
      if(
        typeof loadDeferredPortalData_==='function'&&
        (typeof portalDeferredLoadBusy_==='undefined'||!portalDeferredLoadBusy_)
      ){
        loadDeferredPortalData_();
      }
    }catch(error){}
  }

  function recordPrimaryFailure_(error){
    if(!DATA) return;
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    const code=String(error&&error.code||'bridge_error');
    DATA.supabaseDomainSources.itinerary='supabase-primary-fallback-sheets';
    DATA.supabaseDomainDiagnostics.itinerary={
      code:code,
      message:String(error&&error.message||'Supabase Itinerary primary read failed.')
    };

    if(currentView==='itinerary'&&typeof toast==='function'){
      toast('Supabase Itinerary read was unavailable ('+code+'). Using Sheets fallback.',true);
    }

    requestSheetsFallback_();
  }

  function sheetsItineraryReady_(attempt,callback){
    attempt=Number(attempt||0);
    if(DATA&&DATA.deferredLoaded===true&&Array.isArray(DATA.itinerary)){
      callback(null);
      return;
    }

    if(
      attempt===0&&
      typeof loadDeferredPortalData_==='function'&&
      typeof portalDeferredLoadBusy_!=='undefined'&&
      !portalDeferredLoadBusy_
    ){
      try{loadDeferredPortalData_();}catch(error){}
    }

    if(attempt>=100){
      const error=new Error('Authoritative Sheets Itinerary fallback data did not finish loading in time.');
      error.code='sheets_itinerary_not_ready';
      callback(error);
      return;
    }

    setTimeout(function(){sheetsItineraryReady_(attempt+1,callback);},100);
  }

  function socialReady_(attempt,callback){
    attempt=Number(attempt||0);
    if(
      p2PlannerSocialState_&&
      p2PlannerSocialState_.loaded===true&&
      p2PlannerSocialState_.loading!==true&&
      DATA&&
      Array.isArray(DATA.itinerarySignups)&&
      Array.isArray(DATA.plannerComments)
    ){
      callback(null);
      return;
    }
    if(attempt>=75){
      const error=new Error('Authoritative Sheets Itinerary social fallback data did not finish loading in time.');
      error.code='sheets_social_not_ready';
      callback(error);
      return;
    }
    setTimeout(function(){socialReady_(attempt+1,callback);},100);
  }

  function itineraryRead_(){
    if(readInFlight) return;
    if(lastReadAt&&Date.now()-lastReadAt<READ_TTL_MS) return;
    readInFlight=true;
    lastReadAt=Date.now();
    request_()
      .then(function(result){
        if(result&&result.primary===true){
          recordPrimaryResult_(result);
          return;
        }
        recordResult_(result);
      })
      .catch(function(error){
        if(error&&error.primary===true){
          recordPrimaryFailure_(error);
          return;
        }
        recordFailure_(error);
      })
      .then(function(){readInFlight=false;},function(){readInFlight=false;});
  }

  window.addEventListener('message',function(event){
    const data=event&&event.data||{};
    if(data.type!==RESPONSE_TYPE) return;
    if(event.source!==window.parent&&event.source!==window.top) return;
    const id=String(data.requestId||'');
    const waiter=pending[id];
    if(!waiter) return;
    delete pending[id];
    if(data.ok){
      waiter.resolve(data.data||{});
      return;
    }
    const error=new Error(data.error&&data.error.message?String(data.error.message):'Supabase Itinerary request failed.');
    error.code=String(data.error&&data.error.code||'bridge_error');
    error.primary=Boolean(data.error&&data.error.primary);
    error.shadow=Boolean(data.error&&data.error.shadow);
    waiter.reject(error);
  });

  p2PlannerEnsureSocialData_=function(){
    const context=this;
    const args=arguments;

    if(currentView!=='itinerary'){
      return legacyEnsure.apply(context,args);
    }

    if(sheetsReadinessInFlight) return;
    sheetsReadinessInFlight=true;

    sheetsItineraryReady_(0,function(sheetError){
      if(sheetError){
        sheetsReadinessInFlight=false;
        recordFailure_(sheetError);
        return;
      }

      legacyEnsure.apply(context,args);
      socialReady_(0,function(socialError){
        sheetsReadinessInFlight=false;
        if(socialError){
          recordFailure_(socialError);
          return;
        }
        itineraryRead_();
      });
    });
  };
})();
</script>
