<style>
.p2-comment.has-remove{grid-template-columns:minmax(85px,auto) 1fr auto;align-items:start}
.p2-comment-remove{align-self:start;padding:4px 8px;font-size:.72rem;line-height:1.1}
@media(max-width:520px){
  .p2-comment.has-remove{grid-template-columns:1fr auto;gap:4px 8px}
  .p2-comment.has-remove>span{grid-column:1/-1}
}
</style>
<script>
(function installSupabaseItineraryCommentLifecycle_(){
  if(window.__vacationSupabaseItineraryCommentLifecycleInstalled) return;
  if(typeof p2PlannerEnsureSocialData_!=='function'||typeof p2PlannerCommentSection_!=='function') return;
  window.__vacationSupabaseItineraryCommentLifecycleInstalled=true;

  const REQUEST_TYPE='vacation-portal-supabase-itinerary-comment-request';
  const RESPONSE_TYPE='vacation-portal-supabase-domain-response';
  const OP_COMMENT_STATUS='itinerary.comment.status';
  const OP_COMMENT_DELETE='itinerary.comment.delete';
  const REQUEST_TIMEOUT_MS=6500;
  const MEMBERSHIP_TTL_MS=30000;
  const pending={};
  const inheritedEnsureSocial=p2PlannerEnsureSocialData_;
  const inheritedCommentSection=p2PlannerCommentSection_;
  let freshnessTimer=0;
  let lastPrimarySocialStamp=0;
  let membershipRequestInFlight=false;
  let membershipCheckedAt=0;

  function primaryRuntime_(){
    return Boolean(
      DATA&&DATA.supabaseDomainSources&&
      DATA.supabaseDomainSources.itinerary==='supabase-primary'
    );
  }

  function membershipRole_(){
    return String(DATA&&DATA.supabaseItineraryMembership&&DATA.supabaseItineraryMembership.role||'traveler');
  }

  function rememberMembership_(result){
    if(!DATA||!result||!result.membership) return false;
    const previous=membershipRole_();
    DATA.supabaseItineraryMembership={
      role:String(result.membership.role||'traveler'),
      travelerLinked:Boolean(result.membership.travelerLinked)
    };
    return previous!==membershipRole_();
  }

  function requestId_(){
    return 'supa-itin-comment-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
  }

  function hostTargets_(){
    const targets=[];
    try{if(window.parent&&window.parent!==window) targets.push(window.parent);}catch(error){}
    try{if(window.top&&window.top!==window&&targets.indexOf(window.top)===-1) targets.push(window.top);}catch(error){}
    return targets;
  }

  function request_(operation,data,writeMode){
    return new Promise(function(resolve,reject){
      const targets=hostTargets_();
      if(!targets.length){
        const error=new Error('Supabase PWA comment bridge is unavailable.');
        error.code='bridge_no_host';
        reject(error);
        return;
      }

      const id=requestId_();
      const timer=setTimeout(function(){
        delete pending[id];
        const error=new Error('Supabase PWA comment bridge timed out.');
        error.code='bridge_timeout';
        reject(error);
      },REQUEST_TIMEOUT_MS);

      pending[id]={
        resolve:function(value){clearTimeout(timer);resolve(value);},
        reject:function(error){clearTimeout(timer);reject(error);}
      };

      const payload={
        type:REQUEST_TYPE,
        requestId:id,
        operation:String(operation||''),
        data:data||{}
      };
      if(writeMode) payload.writeMode=String(writeMode);
      targets.forEach(function(target){try{target.postMessage(payload,'*');}catch(error){}});
    });
  }

  // IMPORTANT: the Supabase domain bridges share one response event type.
  // Only consume responses whose request IDs were created by this lifecycle
  // layer. Alpha2.22 reacted to every successful domain response and could
  // continuously rerender Itinerary while other bridges were settling.
  window.addEventListener('message',function(event){
    const data=event&&event.data||{};
    if(data.type!==RESPONSE_TYPE) return;
    if(event.source!==window.parent&&event.source!==window.top) return;
    const id=String(data.requestId||'');
    const waiter=pending[id];
    if(!waiter) return;

    delete pending[id];
    if(data.ok){
      waiter.resolve(data.data||{});
      return;
    }
    const error=new Error(data.error&&data.error.message?String(data.error.message):'Supabase Itinerary comment request failed.');
    error.code=String(data.error&&data.error.code||'bridge_error');
    waiter.reject(error);
  });

  function ensureMembership_(){
    if(!primaryRuntime_()||membershipRequestInFlight) return;
    if(membershipCheckedAt&&Date.now()-membershipCheckedAt<MEMBERSHIP_TTL_MS) return;

    membershipRequestInFlight=true;
    request_(OP_COMMENT_STATUS,{},'primary')
      .then(function(result){
        membershipCheckedAt=Date.now();
        const changed=rememberMembership_(result);
        if(changed&&currentView==='itinerary') render();
      })
      .catch(function(error){
        console.warn('Supabase Itinerary comment membership check was unavailable.',error);
      })
      .then(function(){membershipRequestInFlight=false;},function(){membershipRequestInFlight=false;});
  }

  function stopFreshnessTimer_(){
    if(freshnessTimer){
      clearInterval(freshnessTimer);
      freshnessTimer=0;
    }
  }

  function scheduleFreshnessRender_(){
    if(currentView!=='itinerary') return;

    const currentStamp=Number(
      typeof p2PlannerSocialState_!=='undefined'&&p2PlannerSocialState_
        ?p2PlannerSocialState_.lastLoaded||0
        :0
    );
    if(primaryRuntime_()&&currentStamp&&currentStamp===lastPrimarySocialStamp){
      ensureMembership_();
      return;
    }
    if(freshnessTimer) return;

    let attempts=0;
    freshnessTimer=setInterval(function(){
      attempts++;
      if(currentView!=='itinerary'){
        stopFreshnessTimer_();
        return;
      }

      if(primaryRuntime_()){
        ensureMembership_();
        const stamp=Number(
          typeof p2PlannerSocialState_!=='undefined'&&p2PlannerSocialState_
            ?p2PlannerSocialState_.lastLoaded||0
            :0
        );
        if(stamp&&stamp!==lastPrimarySocialStamp){
          lastPrimarySocialStamp=stamp;
          stopFreshnessTimer_();
          setTimeout(function(){
            if(currentView==='itinerary') render();
          },0);
          return;
        }
      }

      if(attempts>=80) stopFreshnessTimer_();
    },100);
  }

  p2PlannerEnsureSocialData_=function(){
    const result=inheritedEnsureSocial.apply(this,arguments);
    scheduleFreshnessRender_();
    return result;
  };

  function canRemove_(row){
    const id=String(row&&row['Planner Comment ID']||'');
    if(!/^PCOM-[A-Z0-9]{10}$/i.test(id)) return false;
    if(String(row&&row['Traveler ID']||'')===String(currentTravelerId||'')) return true;
    return primaryRuntime_()&&membershipRole_()==='organizer';
  }

  p2PlannerCommentSection_=function(type,itemId,label){
    if(type!=='Itinerary') return inheritedCommentSection.apply(this,arguments);

    const comments=p2PlannerComments_(type,itemId);
    const visible=comments.slice(-3);
    return `<div class="p2-comment-section">
      <div class="p2-mini-head"><strong>${esc(label)}</strong><button type="button" class="ghost tiny" onclick="openP2PlannerComment_('${escAttr(type)}','${escAttr(itemId)}')">+ Comment</button></div>
      ${visible.length?`<div class="p2-comments">
        ${visible.map(function(row){
          const removable=canRemove_(row);
          const id=String(row['Planner Comment ID']||'');
          return `<div class="p2-comment ${removable?'has-remove':''}">
            <strong>${esc(row.travelerName||row['Traveler Name']||'Traveler')}</strong>
            <span>${esc(row.Comment||'')}</span>
            ${removable?`<button type="button" class="ghost tiny p2-comment-remove" onclick="deleteP2PlannerComment_('Itinerary','${escAttr(id)}')">Remove</button>`:''}
          </div>`;
        }).join('')}
      </div>`:`<p class="p2-empty-mini">No comments yet.</p>`}
      ${comments.length>3?`<small class="muted">Showing the latest 3 of ${comments.length} comments.</small>`:''}
    </div>`;
  };

  function findComment_(commentId){
    return ((DATA&&DATA.plannerComments)||[]).find(function(row){
      return String(row['Planner Comment ID']||'')===String(commentId||'')&&
        String(row['Planner Type']||'')==='Itinerary';
    })||null;
  }

  function cloneComments_(rows){
    return (rows||[]).map(function(row){return Object.assign({},row);});
  }

  function removeLocal_(commentId){
    if(DATA&&Array.isArray(DATA.plannerComments)){
      DATA.plannerComments=DATA.plannerComments.filter(function(row){
        return !(String(row['Planner Comment ID']||'')===String(commentId||'')&&String(row['Planner Type']||'')==='Itinerary');
      });
    }
    if(
      DATA&&DATA.supabaseItineraryShadow&&
      Array.isArray(DATA.supabaseItineraryShadow.plannerComments)
    ){
      DATA.supabaseItineraryShadow.plannerComments=DATA.supabaseItineraryShadow.plannerComments.filter(function(row){
        return String(row['Planner Comment ID']||'')!==String(commentId||'');
      });
    }
  }

  function restoreLocal_(dataComments,shadowComments){
    if(!DATA) return;
    DATA.plannerComments=dataComments;
    if(DATA.supabaseItineraryShadow&&shadowComments){
      DATA.supabaseItineraryShadow.plannerComments=shadowComments;
    }
  }

  function sheetsPayload_(row){
    const base={
      commentId:String(row['Planner Comment ID']||''),
      plannerType:'Itinerary',
      travelerId:String(currentTravelerId||''),
      deviceId:String(PWA_DEVICE_ID_||'')
    };
    return typeof organizerAuthorizationValues_==='function'
      ?organizerAuthorizationValues_(base)
      :base;
  }

  function verifySheetsRemoved_(commentId,onSuccess,onFailure){
    google.script.run
      .withSuccessHandler(function(result){
        const exists=((result&&result.plannerComments)||[]).some(function(row){
          return String(row['Planner Comment ID']||'')===String(commentId||'');
        });
        if(exists){
          onFailure(new Error('Sheets backup still contains the removed comment.'));
          return;
        }
        onSuccess();
      })
      .withFailureHandler(onFailure)
      .getPlannerSocialData();
  }

  function deleteFromSheets_(row,onSuccess,onFailure){
    const own=String(row['Traveler ID']||'')===String(currentTravelerId||'');
    const invoke=function(){
      google.script.run
        .withSuccessHandler(function(){
          verifySheetsRemoved_(row['Planner Comment ID'],onSuccess,onFailure);
        })
        .withFailureHandler(onFailure)
        .deletePlannerComment(sheetsPayload_(row));
    };

    if(own){
      if(typeof p3PlannerSocialEnsureDevice_!=='function'){
        onFailure(new Error('Traveler authorization bridge is unavailable.'));
        return;
      }
      p3PlannerSocialEnsureDevice_(invoke,onFailure);
      return;
    }

    if(typeof withOrganizerAuthorization_!=='function'){
      onFailure(new Error('Organizer authorization is required to remove another traveler’s comment.'));
      return;
    }
    withOrganizerAuthorization_(invoke);
  }

  function settlePrimaryComments_(result){
    const nonItinerary=((DATA&&DATA.plannerComments)||[]).filter(function(row){
      return String(row['Planner Type']||'')!=='Itinerary';
    });
    const itineraryComments=(result&&result.plannerComments)||[];
    DATA.plannerComments=nonItinerary.concat(itineraryComments);
    if(DATA.supabaseItineraryShadow){
      DATA.supabaseItineraryShadow.plannerComments=itineraryComments.slice();
    }
    rememberMembership_(result);
    if(typeof p2PlannerSocialState_!=='undefined'&&p2PlannerSocialState_){
      p2PlannerSocialState_.loaded=true;
      p2PlannerSocialState_.loading=false;
      p2PlannerSocialState_.lastLoaded=Date.now();
      lastPrimarySocialStamp=p2PlannerSocialState_.lastLoaded;
    }
  }

  function primaryDelete_(row,previousData,previousShadow){
    const commentId=String(row['Planner Comment ID']||'');
    const saveId=typeof beginBackgroundSave_==='function'
      ?beginBackgroundSave_('Planner comment','planner-comment-delete:'+commentId)
      :'';

    request_(OP_COMMENT_DELETE,{comment:row},'primary')
      .then(function(result){
        settlePrimaryComments_(result);
        render();
        deleteFromSheets_(row,function(){
          if(saveId&&typeof completeBackgroundSave_==='function') completeBackgroundSave_(saveId,'Comment removed');
          toast('Supabase Itinerary comment removal passed — Sheets backup matches.');
        },function(error){
          if(saveId&&typeof completeBackgroundSave_==='function') completeBackgroundSave_(saveId,'Comment removed from Supabase');
          toast('Supabase Itinerary comment removal passed. Sheets backup sync was unavailable ('+String(error&&error.message||'backup error')+').',true);
        });
      })
      .catch(function(error){
        restoreLocal_(previousData,previousShadow);
        if(saveId&&typeof failBackgroundSave_==='function') failBackgroundSave_(saveId,error,'Comment could not be removed');
        else toast(error&&error.message?error.message:String(error),true);
        render();
      });
  }

  function fallbackDelete_(row,previousData,previousShadow){
    deleteFromSheets_(row,function(){
      if(typeof p2PlannerSocialState_!=='undefined'&&p2PlannerSocialState_){
        p2PlannerSocialState_.lastLoaded=Date.now();
      }
      render();
      toast('Comment removed.');
      request_(OP_COMMENT_DELETE,{comment:row},'shadow').catch(function(error){
        console.warn('Supabase Itinerary comment delete mirror was unavailable.',error);
      });
    },function(error){
      restoreLocal_(previousData,previousShadow);
      render();
      toast(error&&error.message?error.message:String(error),true);
    });
  }

  window.deleteP2PlannerComment_=function(type,commentId){
    if(type!=='Itinerary') return;
    const row=findComment_(commentId);
    if(!row) return;
    if(!canRemove_(row)){
      toast('You can only remove your own comments unless you are signed in as the organizer.',true);
      return;
    }
    if(!window.confirm('Remove this comment?')) return;

    const previousData=cloneComments_((DATA&&DATA.plannerComments)||[]);
    const previousShadow=(DATA&&DATA.supabaseItineraryShadow&&Array.isArray(DATA.supabaseItineraryShadow.plannerComments))
      ?cloneComments_(DATA.supabaseItineraryShadow.plannerComments)
      :null;
    removeLocal_(commentId);
    render();

    if(primaryRuntime_()){
      primaryDelete_(row,previousData,previousShadow);
    }else{
      fallbackDelete_(row,previousData,previousShadow);
    }
  };

  scheduleFreshnessRender_();
})();
</script>
