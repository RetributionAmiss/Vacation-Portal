<script>
/*
 * Guarded Packing cutover. Sheets stays visible and authoritative while
 * authenticated Supabase reads and post-save mutation mirrors are compared
 * field-for-field. Supabase session tokens remain in the top-level PWA shell.
 */
(function installSupabasePackingBridge_(){
  if(typeof p3PackingLoad_!=='function') return;
  if(window.__vacationSupabasePackingReadBridgeInstalled) return;
  window.__vacationSupabasePackingReadBridgeInstalled=true;

  const DOMAIN_REQUEST_TYPE='vacation-portal-supabase-domain-request';
  const PACKING_WRITE_REQUEST_TYPE='vacation-portal-supabase-packing-write-request';
  const RESPONSE_TYPE='vacation-portal-supabase-domain-response';
  const OP_READ_PACKING='packingItems.read';
  const OP_UPSERT_PACKING='packingItems.upsert';
  const OP_TOGGLE_PACKING='packingItems.toggle';
  const OP_DELETE_PACKING='packingItems.delete';
  const REQUEST_TIMEOUT_MS=5500;
  const READ_TTL_MS=15000;
  const pending={};
  const legacyPackingLoad=p3PackingLoad_;
  const legacyPackingSave=typeof p3PackingSave_==='function'?p3PackingSave_:null;
  const legacyPackingToggle=typeof p3PackingToggle_==='function'?p3PackingToggle_:null;
  const legacyPackingDelete=typeof p3PackingDeleteNow_==='function'?p3PackingDeleteNow_:null;
  let shadowRequestInFlight=false;
  let lastShadowRequestAt=0;
  let shadowStatusAnnounced=false;

  function requestId_(){
    return 'supa-pack-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
  }

  function hostTargets_(){
    const targets=[];
    try{
      if(window.parent&&window.parent!==window) targets.push(window.parent);
    }catch(error){}
    try{
      if(window.top&&window.top!==window&&targets.indexOf(window.top)===-1) targets.push(window.top);
    }catch(error){}
    return targets;
  }

  function request_(operation,data,requestType){
    return new Promise(function(resolve,reject){
      const targets=hostTargets_();
      if(!targets.length){
        const error=new Error('Supabase PWA bridge is unavailable.');
        error.code='bridge_no_host';
        reject(error);
        return;
      }

      const id=requestId_();
      const timer=setTimeout(function(){
        delete pending[id];
        const error=new Error('Supabase PWA bridge timed out.');
        error.code='bridge_timeout';
        reject(error);
      },REQUEST_TIMEOUT_MS);

      pending[id]={
        resolve:function(value){clearTimeout(timer);resolve(value);},
        reject:function(error){clearTimeout(timer);reject(error);}
      };

      const payload={
        type:requestType||DOMAIN_REQUEST_TYPE,
        requestId:id,
        operation:operation,
        data:data||{}
      };

      targets.forEach(function(target){
        try{target.postMessage(payload,'*');}catch(error){}
      });
    });
  }

  function comparableItem_(row){
    row=row||{};
    return {
      id:String(row['Packing ID']||''),
      scope:String(row.Scope||'Personal')==='Shared'?'Shared':'Personal',
      ownerTravelerId:String(row['Owner Traveler ID']||''),
      bringingTravelerId:String(row['Bringing Traveler ID']||''),
      category:String(row.Category||'Other'),
      item:String(row.Item||'').trim(),
      quantity:String(row.Quantity===undefined||row.Quantity===null?'':row.Quantity).trim(),
      packed:String(row.Packed||'No')==='Yes'?'Yes':'No',
      notes:String(row.Notes||'').trim()
    };
  }

  function comparableItems_(rows){
    return (rows||[])
      .map(comparableItem_)
      .sort(function(a,b){return (a.id+'|'+a.ownerTravelerId).localeCompare(b.id+'|'+b.ownerTravelerId);});
  }

  function itemsMatchSheets_(supabaseItems){
    const sheetsJson=JSON.stringify(comparableItems_(DATA.packingItems||[]));
    const supabaseJson=JSON.stringify(comparableItems_(supabaseItems||[]));
    return sheetsJson===supabaseJson;
  }

  function announceStatus_(status,code){
    if(shadowStatusAnnounced||currentView!=='packing'||typeof toast!=='function') return;
    shadowStatusAnnounced=true;
    if(status==='sheets+supabase-packing-shadow-match'){
      toast('Supabase Packing check passed — data matches Sheets.');
      return;
    }
    if(status==='sheets+supabase-packing-shadow-mismatch'){
      toast('Supabase Packing check found a difference. Sheets is still being used.',true);
      return;
    }
    const suffix=code?' ('+String(code)+')':'';
    toast('Supabase Packing check was unavailable'+suffix+'. Sheets is still being used.',true);
  }

  function mutationLabel_(action){
    if(action==='delete') return 'delete';
    if(action==='toggle') return 'toggle';
    return 'save';
  }

  function announceMutationStatus_(action,status,code){
    if(currentView!=='packing'||typeof toast!=='function') return;
    const label=mutationLabel_(action);
    if(status==='match'){
      toast('Supabase Packing '+label+' check passed — data matches Sheets.');
      return;
    }
    if(status==='mismatch'){
      toast('Supabase Packing '+label+' check found a difference. Sheets is still primary.',true);
      return;
    }
    const suffix=code?' ('+String(code)+')':'';
    toast('Supabase Packing '+label+' check was unavailable'+suffix+'. Sheets saved successfully.',true);
  }

  function recordComparison_(supabaseItems,attempt){
    attempt=Number(attempt||0);
    if(p3PackingState_.loading&&attempt<50){
      setTimeout(function(){recordComparison_(supabaseItems,attempt+1);},100);
      return;
    }

    DATA.supabasePackingShadowItems=(supabaseItems||[]).map(function(row){return Object.assign({},row);});
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};

    const status=itemsMatchSheets_(supabaseItems)
      ? 'sheets+supabase-packing-shadow-match'
      : 'sheets+supabase-packing-shadow-mismatch';
    DATA.supabaseDomainSources.packingItems=status;
    delete DATA.supabaseDomainDiagnostics.packingItems;
    announceStatus_(status);
  }

  function recordUnavailable_(error){
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    const code=String(error&&error.code||'bridge_error');
    DATA.supabaseDomainSources.packingItems='sheets+supabase-packing-shadow-unavailable';
    DATA.supabaseDomainDiagnostics.packingItems={
      code:code,
      message:String(error&&error.message||'Supabase Packing read failed.')
    };
    announceStatus_('sheets+supabase-packing-shadow-unavailable',code);
  }

  function recordMutationComparison_(action,supabaseItems){
    DATA.supabasePackingShadowItems=(supabaseItems||[]).map(function(row){return Object.assign({},row);});
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    const matches=itemsMatchSheets_(supabaseItems);
    DATA.supabaseDomainSources.packingItems=matches
      ? 'sheets+supabase-packing-shadow-write-match'
      : 'sheets+supabase-packing-shadow-write-mismatch';
    delete DATA.supabaseDomainDiagnostics.packingItems;
    announceMutationStatus_(action,matches?'match':'mismatch');
  }

  function recordMutationFailure_(action,error){
    DATA.supabaseDomainSources=DATA.supabaseDomainSources||{};
    DATA.supabaseDomainDiagnostics=DATA.supabaseDomainDiagnostics||{};
    const code=String(error&&error.code||'bridge_error');
    DATA.supabaseDomainSources.packingItems='sheets+supabase-packing-shadow-write-unavailable';
    DATA.supabaseDomainDiagnostics.packingItems={
      operation:action,
      code:code,
      message:String(error&&error.message||'Supabase Packing mutation failed.')
    };
    announceMutationStatus_(action,'unavailable',code);
  }

  function pendingKeys_(){
    try{
      if(typeof p3PackingPending_==='undefined'||!p3PackingPending_) return [];
      return Object.keys(p3PackingPending_).filter(function(key){return Boolean(p3PackingPending_[key]);});
    }catch(error){
      return [];
    }
  }

  function packingPending_(id){
    return pendingKeys_().indexOf(String(id||''))>=0;
  }

  function waitForPackingMutation_(pendingId,callback,attempt){
    attempt=Number(attempt||0);
    if(!packingPending_(pendingId)){
      callback();
      return;
    }
    if(attempt>=100){
      const error=new Error('Sheets Packing mutation did not settle in time.');
      error.code='sheets_settle_timeout';
      recordMutationFailure_('save',error);
      return;
    }
    setTimeout(function(){waitForPackingMutation_(pendingId,callback,attempt+1);},100);
  }

  function shadowWrite_(action,item){
    let operation=OP_UPSERT_PACKING;
    const data={item:item||{}};
    if(action==='delete') operation=OP_DELETE_PACKING;
    if(action==='toggle'){
      operation=OP_TOGGLE_PACKING;
      data.packed=String(item&&item.Packed||'No')==='Yes';
    }

    request_(operation,data,PACKING_WRITE_REQUEST_TYPE)
      .then(function(result){
        recordMutationComparison_(action,(result&&result.items)||[]);
      })
      .catch(function(error){
        recordMutationFailure_(action,error);
      });
  }

  window.addEventListener('message',function(event){
    const data=event&&event.data||{};
    if(data.type!==RESPONSE_TYPE) return;
    if(event.source!==window.parent&&event.source!==window.top) return;
    const id=String(data.requestId||'');
    const waiter=pending[id];
    if(!waiter) return;
    delete pending[id];

    if(data.ok){
      waiter.resolve(data.data||{});
      return;
    }

    const error=new Error(
      data.error&&data.error.message
        ? String(data.error.message)
        : 'Supabase domain request failed.'
    );
    error.code=String(data.error&&data.error.code||'bridge_error');
    waiter.reject(error);
  });

  if(legacyPackingSave){
    p3PackingSave_=function(event,id){
      const beforeRows=((DATA&&DATA.packingItems)||[]).map(function(row){return Object.assign({},row);});
      const beforeIds=beforeRows.reduce(function(map,row){
        map[String(row['Packing ID']||'')]=true;
        return map;
      },{});
      const beforePending=pendingKeys_().reduce(function(map,key){map[key]=true;return map;},{});
      const editId=String(id||'');
      const result=legacyPackingSave.apply(this,arguments);
      const newPending=pendingKeys_().find(function(key){return !beforePending[key];});
      if(!newPending) return result;

      waitForPackingMutation_(newPending,function(){
        const rows=(DATA&&DATA.packingItems)||[];
        let settled=null;
        if(editId){
          settled=rows.find(function(row){return String(row['Packing ID']||'')===editId;})||null;
        }else{
          settled=rows.find(function(row){
            const packingId=String(row['Packing ID']||'');
            return packingId&&packingId.indexOf('LOCAL-PACK-')!==0&&!beforeIds[packingId];
          })||null;
        }
        if(!settled) return;
        shadowWrite_('save',Object.assign({},settled));
      },0);

      return result;
    };
  }

  if(legacyPackingToggle){
    p3PackingToggle_=function(id,packed){
      id=String(id||'');
      const before=((DATA&&DATA.packingItems)||[]).find(function(row){
        return String(row['Packing ID']||'')===id;
      });
      if(!before) return legacyPackingToggle.apply(this,arguments);
      const wasPending=packingPending_(id);
      const result=legacyPackingToggle.apply(this,arguments);
      if(wasPending||!packingPending_(id)) return result;

      waitForPackingMutation_(id,function(){
        const settled=((DATA&&DATA.packingItems)||[]).find(function(row){
          return String(row['Packing ID']||'')===id;
        });
        if(!settled) return;
        const expected=Boolean(packed)?'Yes':'No';
        if(String(settled.Packed||'No')!==expected) return;
        shadowWrite_('toggle',Object.assign({},settled));
      },0);

      return result;
    };
  }

  if(legacyPackingDelete){
    p3PackingDeleteNow_=function(id){
      id=String(id||'');
      const before=((DATA&&DATA.packingItems)||[]).find(function(row){
        return String(row['Packing ID']||'')===id;
      });
      if(!before) return legacyPackingDelete.apply(this,arguments);
      const wasPending=packingPending_(id);
      const result=legacyPackingDelete.apply(this,arguments);
      if(wasPending||!packingPending_(id)) return result;

      waitForPackingMutation_(id,function(){
        const stillThere=((DATA&&DATA.packingItems)||[]).some(function(row){
          return String(row['Packing ID']||'')===id;
        });
        if(stillThere) return;
        shadowWrite_('delete',Object.assign({},before));
      },0);

      return result;
    };
  }

  p3PackingLoad_=function(force){
    const legacyResult=legacyPackingLoad.apply(this,arguments);
    if(shadowRequestInFlight) return legacyResult;
    if(!force&&lastShadowRequestAt&&Date.now()-lastShadowRequestAt<READ_TTL_MS) return legacyResult;

    shadowRequestInFlight=true;
    lastShadowRequestAt=Date.now();
    request_(OP_READ_PACKING,{},DOMAIN_REQUEST_TYPE)
      .then(function(result){
        recordComparison_((result&&result.items)||[],0);
      })
      .catch(function(error){
        recordUnavailable_(error);
      })
      .then(function(){
        shadowRequestInFlight=false;
      },function(){
        shadowRequestInFlight=false;
      });

    return legacyResult;
  };
})();
</script>
