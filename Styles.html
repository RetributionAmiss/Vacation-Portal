<style>
:root {
  --pine:#234c3c; --pine2:#17372b; --cream:#f5f1e8; --paper:#fffdf8;
  --ink:#203029; --muted:#6d776f; --line:#ddd6c8; --gold:#c49a45;
  --danger:#a84134; --shadow:0 14px 40px rgba(26,48,38,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.loading-screen{min-height:100vh;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at top,#355f4f,var(--pine2));color:white}
.mountain-mark{font-size:52px;color:var(--gold)}
.loading-screen h1{margin:10px 0 4px}
.loading-screen p{opacity:.8}
.app{max-width:1500px;margin:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;background:var(--paper);padding:22px 26px;border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{margin:0;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.15em}
h1,h2,h3{font-family:Georgia,serif}
.topbar h1{margin:4px 0;font-size:30px}
.muted{color:var(--muted)}
.topbar-actions{display:flex;gap:10px;align-items:flex-end}
.traveler-picker{display:grid;gap:4px;font-size:11px;color:var(--muted)}
select,input,textarea{border:1px solid var(--line);background:white;border-radius:10px;padding:10px;color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--pine);color:white;font-weight:700}
button.ghost,.ghost{background:white;color:var(--pine);border:1px solid var(--line)}
button.danger{background:var(--danger)}
.main-nav{display:flex;gap:8px;overflow:auto;padding:16px 2px}
.main-nav button{white-space:nowrap;background:transparent;color:var(--muted)}
.main-nav button.active{background:var(--pine);color:white}
.view{display:grid;gap:18px}
.hero{background:linear-gradient(120deg,var(--pine),#48705f);color:white;border-radius:22px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center}
.hero h2{font-size:34px;margin:5px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat,.panel{background:var(--paper);border:1px solid rgba(35,76,60,.08);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(26,48,38,.07)}
.stat strong{display:block;font-size:28px;font-family:Georgia,serif}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}
.panel-head h2,.panel-head h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(35,76,60,.08)}
.card-image{height:220px;background:#dfe5df center/cover no-repeat;position:relative}
.card-image .badge{position:absolute;left:12px;top:12px;background:white;color:var(--pine);padding:7px 9px;border-radius:99px;font-size:11px;font-weight:800}
.card-image .heart{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;padding:0;background:rgba(255,255,255,.92);color:#8c3b34;font-size:19px}
.card-body{padding:18px}
.card h3{margin:0 0 5px;font-size:22px}
.card-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.pill{background:#edf2ee;color:var(--pine);padding:6px 9px;border-radius:99px;font-size:10px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.notice{padding:12px;border-radius:12px;background:#fff3d5;color:#73520c;margin:12px 0;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input{min-width:250px;flex:1}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}
th,td{padding:11px;border-bottom:1px solid #eee8de;text-align:left;font-size:12px}
th{background:#edf2ee;color:var(--pine)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid label{display:grid;gap:5px;font-size:11px;color:var(--muted)}
.form-grid .wide{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;padding:20px}
.modal-backdrop{position:absolute;inset:0;background:rgba(12,28,21,.72);backdrop-filter:blur(5px)}
.modal-panel{position:relative;z-index:1;width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.modal-close{position:absolute;right:14px;top:14px;background:white;color:var(--ink);border:1px solid var(--line);width:36px;height:36px;padding:0;border-radius:50%;font-size:22px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--pine2);color:white;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:200}
.room-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.room{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:150px}
.assignment{display:flex;justify-content:space-between;background:#edf2ee;padding:8px;border-radius:9px;margin-top:7px;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5);border:1px dashed var(--line);border-radius:16px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.room-board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.app{padding:10px}.topbar,.hero{align-items:stretch;flex-direction:column}.topbar-actions{align-items:stretch}.grid,.stats,.room-board,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.card-image{height:190px}}

.diagnostic-list{display:grid;gap:9px;margin-top:14px}
.diagnostic-row{display:grid;grid-template-columns:220px 1fr;gap:12px;padding:11px;border-radius:10px;background:#edf2ee}
.diagnostic-row.pass{border-left:5px solid #2f7d52}
.diagnostic-row.warn{border-left:5px solid #c49a45}
.diagnostic-row.fail{border-left:5px solid #a84134}
.diagnostic-row span{color:var(--muted)}
@media(max-width:650px){.diagnostic-row{grid-template-columns:1fr}}

.rental-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.provider-tag,.import-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:#edf2ee;color:#315544}
.rental-image{position:relative;min-height:220px;background:#e7ebe7;overflow:hidden}
.rental-image img{width:100%;height:220px;object-fit:cover;display:block}
.rental-image .import-badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92)}
.favorite-button{position:absolute;right:10px;top:10px;border-radius:50%;width:38px;height:38px;padding:0}
.image-placeholder{height:220px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.detail-photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.detail-photo{width:100%;height:120px;object-fit:cover;border-radius:10px}
.detail-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.detail-facts p{background:#edf2ee;padding:10px;border-radius:10px;margin:0}
@media(max-width:700px){
  .detail-photo-grid,.detail-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.card-price{font-size:1.08rem;color:#173f32}

.import-progress{display:flex;align-items:center;gap:10px}
.progress-spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(23,63,50,.22);
  border-top-color:#173f32;
  border-radius:50%;
  flex:0 0 auto;
  animation:portalSpin .8s linear infinite
}
@keyframes portalSpin{to{transform:rotate(360deg)}}

.live-notifications{
  position:fixed;
  right:20px;
  top:20px;
  z-index:210;
  display:grid;
  gap:10px;
  width:min(390px,calc(100vw - 30px))
}
.live-notification{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:11px;
  width:100%;
  text-align:left;
  background:var(--paper);
  color:var(--ink);
  border:1px solid rgba(35,76,60,.18);
  border-left:5px solid var(--gold);
  box-shadow:0 18px 45px rgba(20,45,35,.22);
  padding:13px 14px;
  animation:notificationIn .28s ease-out
}
.live-notification:hover{transform:translateY(-1px)}
.live-notification-icon{font-size:24px}
.live-notification strong,.live-notification small{display:block}
.live-notification small{color:var(--muted);margin-top:3px;line-height:1.35}
.live-notification-action{color:var(--pine);font-size:11px;font-weight:800}
.live-notification.leaving{opacity:0;transform:translateX(25px);transition:.3s ease}
.feedback-form h2{margin:5px 0 8px}
@keyframes notificationIn{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:650px){
  .live-notifications{right:10px;top:10px;width:calc(100vw - 20px)}
}


.rental-filter-toolbar{
  display:grid;
  grid-template-columns:
    minmax(210px,1.5fr)
    minmax(190px,1.2fr)
    repeat(3,minmax(135px,.8fr))
    repeat(2,minmax(135px,.8fr))
    minmax(155px,.9fr)
    auto;
  gap:9px;
  align-items:center
}
.rental-filter-toolbar input,
.rental-filter-toolbar select{
  min-width:0;
  width:100%
}
.filter-summary{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:center;
  margin:-4px 0 15px;
  font-size:12px
}
#rentalVisibleCount{font-weight:800;color:var(--pine)}
@media(max-width:1200px){
  .rental-filter-toolbar{
    grid-template-columns:repeat(4,minmax(150px,1fr))
  }
}
@media(max-width:760px){
  .rental-filter-toolbar{
    grid-template-columns:1fr 1fr
  }
  .filter-summary{
    align-items:flex-start;
    flex-direction:column;
    gap:4px
  }
}
@media(max-width:480px){
  .rental-filter-toolbar{grid-template-columns:1fr}
}


.room-planner-selector{
  display:grid;
  grid-template-columns:minmax(280px,460px) 1fr;
  gap:18px;
  align-items:end;
  margin:6px 0 22px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(235,241,237,.62)
}
.room-planner-selector label span{
  display:block;
  font-size:11px;
  font-weight:800;
  margin-bottom:6px
}
.room-planner-selector select{width:100%}
.room-planner-summary{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding-bottom:5px
}
.room-planner-summary strong{font-size:16px}
.room-planner-summary span{font-size:12px;color:var(--muted)}
@media(max-width:760px){
  .room-planner-selector{grid-template-columns:1fr}
}


.traveler-welcome h2{margin:5px 0 8px}
.traveler-choice-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin:18px 0
}
.traveler-choice{
  display:grid;
  grid-template-columns:44px 1fr;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:66px;
  padding:10px 12px;
  text-align:left;
  color:var(--ink);
  background:rgba(235,241,237,.7);
  border:1px solid var(--line);
  border-radius:14px
}
.traveler-choice:hover{
  border-color:var(--pine);
  background:rgba(226,239,231,.95);
  transform:translateY(-1px)
}
.traveler-choice-avatar{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border-radius:50%;
  color:white;
  background:var(--pine);
  font-size:13px;
  font-weight:900;
  letter-spacing:.04em
}
.traveler-choice strong,
.traveler-choice small{display:block}
.traveler-choice small{
  color:var(--muted);
  margin-top:3px;
  font-weight:500
}
.traveler-remember-note{
  margin:8px 0 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.5
}
@media(max-width:600px){
  .traveler-choice-grid{grid-template-columns:1fr}
}


.background-save-status{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:205;
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 14px;
  border:1px solid rgba(35,76,60,.18);
  border-radius:999px;
  background:var(--paper);
  color:var(--pine);
  box-shadow:0 12px 35px rgba(20,45,35,.18);
  font-size:12px;
  font-weight:800
}

.loading-detail{
  min-height:20px;
  margin-top:8px;
  font-size:12px;
  opacity:.76;
  transition:opacity .2s ease
}
@keyframes portalLoadingSpin{
  to{transform:rotate(360deg)}
}




.collaborative-vote-summary{
  display:grid;
  grid-template-columns:minmax(180px,.8fr) minmax(220px,1.2fr);
  gap:10px;
  margin:11px 0
}
.my-rating,
.family-review-progress{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  background:rgba(235,241,237,.56)
}
.my-rating strong,
.my-rating span,
.family-review-progress strong,
.family-review-progress span{display:block}
.my-rating span,
.family-review-progress span{
  margin-top:3px;
  color:var(--muted);
  font-size:11px
}
.my-rating.reviewed{
  border-color:rgba(31,116,72,.3);
  background:rgba(39,145,88,.1)
}
.my-rating.reviewed strong{color:#17643d}
.my-rating.unreviewed{opacity:.82}
.review-progress-track{
  height:7px;
  margin-top:8px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(35,76,60,.13)
}
.review-progress-track span{
  display:block;
  height:100%;
  margin:0;
  border-radius:999px;
  background:var(--gold)
}
.top-reasons{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  margin:8px 0 11px;
  font-size:10px
}
.top-reasons strong{margin-right:2px}
.top-reasons span{
  padding:5px 8px;
  border-radius:999px;
  background:#edf2ee;
  color:var(--pine)
}
.vote-primary.voted{
  background:#238152 !important;
  border-color:#17643d !important;
  box-shadow:0 7px 18px rgba(35,129,82,.23)
}
.compare-checkbox{
  position:absolute;
  left:12px;
  bottom:12px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  color:var(--pine);
  font-size:10px;
  font-weight:800;
  cursor:pointer
}
.compare-checkbox input{margin:0}
.compare-bar{
  position:fixed;
  left:50%;
  bottom:18px;
  z-index:210;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;
  width:min(620px,calc(100vw - 24px));
  padding:11px 14px;
  border:1px solid rgba(35,76,60,.2);
  border-radius:16px;
  background:var(--paper);
  box-shadow:0 18px 45px rgba(20,45,35,.24)
}
.compare-bar>div{display:flex;gap:8px}
.top-picks{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:18px;
  align-items:center;
  margin:0 0 16px;
  padding:14px 16px;
  border:1px solid rgba(176,124,12,.25);
  border-radius:16px;
  background:linear-gradient(135deg,rgba(244,196,71,.15),rgba(255,255,255,.75))
}
.top-picks h3{margin:2px 0 0}
.top-pick-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px
}
.top-pick-list button{
  text-align:left;
  background:rgba(255,255,255,.86);
  color:var(--ink);
  border:1px solid rgba(35,76,60,.12)
}
.top-pick-list strong,
.top-pick-list span{display:block}
.top-pick-list span{
  margin-top:4px;
  color:var(--muted);
  font-size:10px
}
.rating-choice-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px
}
.rating-choice{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:11px 7px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#f5f7f4;
  cursor:pointer;
  text-align:center
}
.rating-choice input{
  position:absolute;
  opacity:0;
  pointer-events:none
}
.rating-choice strong{font-size:20px}
.rating-choice span{color:#b9770f;letter-spacing:.02em}
.rating-choice small{color:var(--muted);font-size:9px}
.rating-choice.selected{
  border-color:#d28c16;
  background:rgba(244,196,71,.18);
  box-shadow:0 0 0 2px rgba(210,140,22,.12)
}
.vote-reasons-fieldset{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px
}
.vote-reasons-fieldset legend{
  padding:0 6px;
  font-weight:800
}
.vote-reasons-fieldset legend span{
  color:var(--muted);
  font-size:10px;
  font-weight:500
}
.vote-reason-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px
}
.vote-reason-grid label{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0;
  padding:8px;
  border-radius:9px;
  background:#f3f6f3;
  cursor:pointer
}
.comparison-table th:first-child{
  position:sticky;
  left:0;
  z-index:1;
  background:#edf2ee
}
@media(max-width:900px){
  .top-picks{grid-template-columns:1fr}
  .top-pick-list{grid-template-columns:1fr}
}
@media(max-width:700px){
  .collaborative-vote-summary{grid-template-columns:1fr}
  .rating-choice-grid{grid-template-columns:1fr}
  .rating-choice{flex-direction:row;justify-content:flex-start;text-align:left}
  .vote-reason-grid{grid-template-columns:1fr}
}


.loading-mountain-mark{
  display:inline-block;
  color:var(--gold);
  transform-origin:50% 55%;
  animation:portalTriangleSpin 1.05s linear infinite;
  will-change:transform
}
@keyframes portalTriangleSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}


.card-actions{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px
}
.card-actions .listing-link{
  order:99;
  margin-left:auto;
  background:transparent;
  border-color:transparent;
  color:var(--pine);
  text-decoration:underline;
  text-underline-offset:3px
}
.card-actions .listing-link:hover{
  background:rgba(35,76,60,.06);
  border-color:rgba(35,76,60,.12)
}
@media(max-width:900px){
  .card-actions .listing-link{
    margin-left:0
  }
}


.rental-card-highlight{
  outline:4px solid rgba(210,140,22,.55);
  box-shadow:0 0 0 8px rgba(210,140,22,.13),0 18px 45px rgba(20,45,35,.2);
  transition:outline-color .25s ease,box-shadow .25s ease
}

.top-picks>div:first-child small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:10px
}
.top-pick-list button small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:9px;
  font-weight:600
}
.rental-title-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px
}
.rental-title-row h2{margin:0}
.top-pick-card-badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(244,196,71,.22);
  color:#7b5510;
  border:1px solid rgba(176,124,12,.25);
  font-size:10px;
  font-weight:900
}
.property-identity{
  margin:4px 0 8px;
  color:var(--muted);
  font-size:10px
}

.rental-grid{
  display:grid;
  gap:26px
}
.rental-card{
  margin-bottom:0;
  overflow:hidden;
  border:1px solid rgba(35,76,60,.15);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(20,45,35,.08)
}
.rental-card + .rental-card{
  margin-top:2px
}
.remove-rental-button,
.remove-rental-confirm{
  background:#a94136 !important;
  color:#fff !important;
  border-color:#8e3028 !important
}
.remove-rental-button:hover,
.remove-rental-confirm:hover{
  background:#8e3028 !important
}
.remove-rental-confirmation p{
  line-height:1.55
}
.remove-rental-confirmation .warning{
  margin:14px 0
}
@media(max-width:700px){
  .rental-grid{gap:20px}
}


.compare-bar-copy{display:flex;flex-direction:column;gap:2px}
