<style>
.p22-grocery-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 18px;padding:10px 12px;border:1px solid var(--line,#d9d2c5);border-radius:16px;background:rgba(255,255,255,.6)}
.p22-grocery-toolbar>span{font-weight:700;color:var(--muted,#6e786f);white-space:nowrap}
.p22-sort-options{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.p22-sort-options button{min-height:38px;padding:7px 12px;border-radius:999px;border:1px solid var(--line,#d9d2c5);background:var(--paper,#fff);color:var(--pine,#1f5845);font-weight:700}
.p22-sort-options button.is-active{background:var(--pine,#1f5845);color:#fff;border-color:var(--pine,#1f5845)}
.p22-grocery-groups{display:grid;gap:18px}
.p22-grocery-group{display:grid;gap:8px}
.p22-grocery-group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.p22-grocery-group-head strong{font-size:1rem;color:var(--pine,#1f5845)}
.p22-grocery-group-head span{font-size:.82rem;color:var(--muted,#6e786f)}
.p22-grocery-group .p2-grocery-list{display:grid;gap:8px}

.p22-meal-calendar-shell{margin:14px 0 20px;padding:14px;border:1px solid var(--line,#d9d2c5);border-radius:18px;background:rgba(255,255,255,.55)}
.p22-meal-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.p22-meal-calendar-head strong{color:var(--pine,#1f5845)}
.p22-meal-calendar-head span{font-size:.86rem;color:var(--muted,#6e786f)}
.p22-meal-day-nav{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.p22-meal-day{position:relative;display:grid;grid-template-rows:auto auto auto;place-items:center;min-width:64px;min-height:76px;padding:8px 9px;border:1px solid var(--line,#d9d2c5);border-radius:16px;background:var(--paper,#fff);color:var(--pine,#1f5845);scroll-snap-align:start}
.p22-meal-day small{font-size:.72rem;font-weight:700;color:var(--muted,#6e786f)}
.p22-meal-day strong{font-size:1.18rem;line-height:1.1}
.p22-meal-day em{font-size:.7rem;font-style:normal;text-transform:uppercase;color:var(--muted,#6e786f)}
.p22-meal-day>span{position:absolute;top:5px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:rgba(31,88,69,.12);font-size:.68rem;line-height:18px;font-weight:800}
.p22-meal-day.is-selected{background:var(--pine,#1f5845);color:#fff;border-color:var(--pine,#1f5845);box-shadow:0 6px 18px rgba(31,88,69,.14)}
.p22-meal-day.is-selected small,.p22-meal-day.is-selected em{color:rgba(255,255,255,.82)}
.p22-meal-day.is-selected>span{background:rgba(255,255,255,.2);color:#fff}
.p22-meal-day-focus{display:grid;gap:12px}
.p22-meal-day-head,.p22-meal-summary-head{display:flex;align-items:end;justify-content:space-between;gap:14px}
.p22-meal-day-head h3,.p22-meal-summary-head h3{margin:0}
.p22-meal-day-head>span,.p22-meal-summary-head>span{font-size:.84rem;color:var(--muted,#6e786f);white-space:nowrap}
.p22-meal-focus-list{display:grid;gap:12px}
.p22-meal-focus-card .p2-card-head{margin-bottom:10px}
.p22-meal-summary{margin-top:20px;padding-top:18px;border-top:1px solid var(--line,#d9d2c5);display:grid;gap:10px}
.p22-meal-summary-list{display:grid;gap:6px}
.p22-meal-summary-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.5);text-align:left;color:inherit}
.p22-meal-summary-row:hover,.p22-meal-summary-row:focus-visible{border-color:var(--line,#d9d2c5)}
.p22-meal-summary-row.is-selected{background:rgba(31,88,69,.08);border-color:rgba(31,88,69,.18)}
.p22-meal-summary-date{font-size:.82rem;font-weight:800;color:var(--pine,#1f5845)}
.p22-meal-summary-row strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p22-meal-summary-row small{color:var(--muted,#6e786f);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:620px){
  .p22-grocery-toolbar{align-items:flex-start;flex-direction:column}
  .p22-sort-options{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .p22-sort-options button{padding:7px 6px;font-size:.84rem}
  .p22-meal-calendar-shell{margin-left:-2px;margin-right:-2px;padding:12px 10px}
  .p22-meal-day{min-width:58px;min-height:72px}
  .p22-meal-day-head,.p22-meal-summary-head{align-items:flex-start}
  .p22-meal-summary-row{grid-template-columns:86px minmax(0,1fr);gap:4px 8px}
  .p22-meal-summary-row small{grid-column:2;max-width:none}
}
</style>
