<style>
.p3r-view{max-width:1040px;margin:0 auto;padding-bottom:96px}.p3r-hero{padding:24px;border:1px solid var(--border);border-radius:22px;background:var(--panel);box-shadow:var(--shadow)}.p3r-hero h2{margin:4px 0 8px}.p3r-hero>p:last-of-type{margin:0;color:var(--muted)}.p3r-counts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.p3r-counts span{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:var(--soft);font-size:.82rem}.p3r-counts strong{font-size:1rem}.p3r-sync{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:.85rem}.p3r-list{display:grid;gap:10px;margin-top:14px}.p3r-item{display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}.p3r-item.overdue{border-left:5px solid #a33}.p3r-item.today{border-left:5px solid #b86c17}.p3r-item.soon{border-left:5px solid #b99a3b}.p3r-marker{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--soft);font-size:.72rem;font-weight:800;letter-spacing:.04em}.p3r-copy{min-width:0}.p3r-meta{display:flex;gap:9px;align-items:center;margin-bottom:3px}.p3r-meta span{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.p3r-meta small{color:var(--muted)}.p3r-copy>strong{display:block;font-size:1rem}.p3r-copy p{margin:3px 0 0;color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}.p3r-item>button{white-space:nowrap}.p3r-empty{margin-top:14px;padding:22px;border:1px dashed var(--border);border-radius:18px;background:var(--panel);display:flex;gap:12px;align-items:center}.p3r-empty>span{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:800}.p3r-empty p{margin:4px 0 0;color:var(--muted)}.p3r-dashboard-card{margin-top:16px;padding:18px;border:1px solid var(--border);border-radius:20px;background:var(--panel);box-shadow:var(--shadow)}.p3r-dashboard-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.p3r-dashboard-head h3{margin:2px 0 0}.p3r-dashboard-list{display:grid;gap:8px;margin-top:12px}.p3r-dashboard-list>button{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) 18px;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:14px;background:var(--soft);color:inherit}.p3r-dashboard-list>button>span{font-size:.7rem;font-weight:800}.p3r-dashboard-list>button div{min-width:0}.p3r-dashboard-list>button strong,.p3r-dashboard-list>button small{display:block}.p3r-dashboard-list>button small{margin-top:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p3r-dashboard-list>button em{font-style:normal;font-size:1.2rem}

</style>
