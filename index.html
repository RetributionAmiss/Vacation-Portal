<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f32">
  <meta name="application-name" content="Family Vacation Portal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Family Vacation">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Family Vacation Portal</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./app-icon-192.png">
  <link rel="apple-touch-icon" href="./app-icon-192.png">

  <style>
    :root{
      color-scheme:light;
      --pine:#173f32;
      --paper:#fffdf8;
      --bg:#f4f6f2;
      --muted:#68776f;
      --line:#dfe5df;
      --gold:#d69a20;
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;
      min-width:100%;
      height:100%;
      min-height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      font-family:Arial,sans-serif;
      color:#13231d;
    }
    body{
      position:fixed;
      inset:0;
      width:100vw;
      height:var(--app-height,100dvh);
      padding:0;
      overscroll-behavior:none;
    }
    #root{
      position:fixed;
      inset:0;
      width:100vw;
      height:var(--app-height,100dvh);
      min-height:0;
      overflow:hidden;
      background:var(--bg);
    }
    #portalFrame{
      position:absolute;
      inset:0;
      z-index:1;
      display:block;
      width:100%;
      height:100%;
      min-height:100%;
      border:0;
      background:var(--bg);
    }
    .shell{
      display:grid;
      place-items:center;
      min-height:var(--app-height,100dvh);
      height:var(--app-height,100dvh);
      overflow:auto;
      padding:
        max(24px,env(safe-area-inset-top))
        max(24px,env(safe-area-inset-right))
        max(24px,env(safe-area-inset-bottom))
        max(24px,env(safe-area-inset-left));
    }
    .setup-card{
      width:min(560px,100%);
      padding:24px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--paper);
      box-shadow:0 18px 55px rgba(23,63,50,.12);
    }
    .app-mark{
      display:grid;
      place-items:center;
      width:64px;
      height:64px;
      margin-bottom:16px;
      border-radius:18px;
      color:white;
      background:linear-gradient(145deg,#173f32,#2d6a50);
      font-size:30px;
    }
    h1{margin:0 0 8px;font-family:Georgia,serif}
    p{line-height:1.55}
    code{
      display:block;
      overflow-wrap:anywhere;
      padding:10px;
      border-radius:9px;
      background:#edf2ee;
      font-size:12px;
    }
    .offline{
      display:none;
      position:fixed;
      left:12px;
      right:12px;
      bottom:calc(12px + env(safe-area-inset-bottom));
      z-index:20;
      padding:11px 13px;
      border-radius:12px;
      color:#73520c;
      background:#fff3d5;
      box-shadow:0 10px 25px rgba(0,0,0,.12);
      font-size:13px;
      font-weight:700;
      text-align:center;
    }
    body.offline-mode .offline{display:block}
  
    .app-tools{
      position:fixed;
      right:max(12px,env(safe-area-inset-right));
      top:max(12px,env(safe-area-inset-top));
      z-index:5000;
      display:flex;
      gap:8px;
      pointer-events:none;
    }
    .app-tools button{
      pointer-events:auto;
      min-height:44px;
      padding:10px 14px;
      border:1px solid rgba(255,255,255,.3);
      border-radius:999px;
      color:white;
      background:rgba(23,63,50,.94);
      box-shadow:0 8px 24px rgba(0,0,0,.2);
      font-weight:800;
      cursor:pointer;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .app-tools button.secondary{
      color:var(--pine);
      background:rgba(255,253,248,.96);
      border-color:var(--line);
    }
    .setup-overlay{
      position:fixed;
      inset:0;
      z-index:6000;
      display:grid;
      place-items:center;
      padding:
        max(18px,env(safe-area-inset-top))
        max(18px,env(safe-area-inset-right))
        max(18px,env(safe-area-inset-bottom))
        max(18px,env(safe-area-inset-left));
      background:rgba(12,28,22,.54);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
    }
    .setup-overlay.hidden{display:none}
    .setup-dialog{
      width:min(520px,100%);
      max-height:min(760px,calc(100dvh - 36px));
      overflow:auto;
      padding:22px;
      border-radius:20px;
      background:var(--paper);
      box-shadow:0 24px 70px rgba(0,0,0,.28);
    }
    .setup-dialog h2{margin:4px 0 8px;font-family:Georgia,serif}
    .setup-dialog .eyebrow{
      margin:0;
      color:#a46c05;
      font-size:11px;
      font-weight:900;
      letter-spacing:.12em;
    }
    .setup-steps{
      display:grid;
      gap:9px;
      margin:16px 0;
      padding:0;
      list-style:none;
      counter-reset:steps;
    }
    .setup-steps li{
      display:grid;
      grid-template-columns:30px 1fr;
      gap:9px;
      align-items:start;
      line-height:1.4;
    }
    .setup-steps li:before{
      counter-increment:steps;
      content:counter(steps);
      display:grid;
      place-items:center;
      width:28px;
      height:28px;
      border-radius:50%;
      color:white;
      background:var(--pine);
      font-weight:900;
    }
    .setup-actions{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:16px;
    }
    .setup-actions button{
      min-height:44px;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      background:white;
      color:var(--pine);
      font-weight:900;
      cursor:pointer;
    }
    .setup-actions button.primary{
      color:white;
      border-color:var(--pine);
      background:var(--pine);
    }
    .setup-status{
      margin:12px 0;
      padding:10px 12px;
      border-radius:10px;
      background:#edf4ef;
      font-size:13px;
      line-height:1.45;
    }
    @media(max-width:650px){
      .app-tools{
        right:10px;
        bottom:max(10px,env(safe-area-inset-bottom));
      }
      .app-tools button{font-size:12px;padding:9px 12px}
    }

  </style>
</head>
<body>
  <main id="root" class="shell">
    <section class="setup-card">
      <div class="app-mark" aria-hidden="true">▲</div>
      <h1>Family Vacation Portal</h1>
      <p>Loading the trip portal…</p>
    </section>
  </main>

  <div class="offline" id="offlineNotice">
    You are offline. The app shell is available, but live trip data requires an internet connection.
  </div>

  <div class="app-tools" id="appTools">
    <button class="secondary" id="installToolButton" type="button">
      📲 Add App
    </button>
    <button id="notifyToolButton" type="button">
      🔔 Enable Notifications
    </button>
  </div>

  <div class="setup-overlay hidden" id="appSetupOverlay">
    <section class="setup-dialog" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <p class="eyebrow">VACATION PORTAL APP</p>
      <h2 id="setupTitle">Put the trip on this device</h2>
      <div id="setupDialogBody"></div>
      <div class="setup-actions" id="setupDialogActions"></div>
    </section>
  </div>

  <script>
    window.OneSignalDeferred=window.OneSignalDeferred||[];
  </script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="./config.js"></script>
  <script>
    (function(){
      function syncAppViewportHeight(){
        const height=
          window.visualViewport && window.visualViewport.height
            ? window.visualViewport.height
            : window.innerHeight;

        document.documentElement.style.setProperty(
          '--app-height',
          Math.max(1,Math.round(height))+'px'
        );
      }

      syncAppViewportHeight();

      window.addEventListener('resize',syncAppViewportHeight);

      if(window.visualViewport){
        window.visualViewport.addEventListener(
          'resize',
          syncAppViewportHeight
        );
        window.visualViewport.addEventListener(
          'scroll',
          syncAppViewportHeight
        );
      }

      const config=window.VACATION_PORTAL_CONFIG||{};
      const url=String(config.portalUrl||'').trim();
      const root=document.getElementById('root');

      const configured=
        url &&
        !url.includes('PASTE_CURRENT_APPS_SCRIPT_EXEC_URL_HERE') &&
        /^https:\/\//i.test(url);

      if(!configured){
        root.innerHTML=`
          <section class="setup-card">
            <div class="app-mark" aria-hidden="true">▲</div>
            <h1>PWA shell is ready</h1>
            <p>
              Open <strong>config.js</strong> and replace the placeholder with the
              deployed Apps Script <strong>/exec</strong> URL.
            </p>
            <code>portalUrl: 'https://script.google.com/macros/s/.../exec'</code>
            <p>
              Then publish this folder on an HTTPS static host. The existing
              Apps Script portal remains the backend and application content.
            </p>
          </section>`;
        return;
      }

      document.title=config.appName||'Family Vacation Portal';

      root.className='portal-root';
      root.innerHTML=`
        <iframe
          id="portalFrame"
          title="Family Vacation Portal"
          allow="clipboard-read; clipboard-write"
          src="${url.replace(/"/g,'&quot;')}"
        ></iframe>`;

      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./service-worker.js')
          .catch(error=>{
            console.warn('Service worker registration failed.',error);
          });
      }

      function updateOnlineState(){
        document.body.classList.toggle(
          'offline-mode',
          !navigator.onLine
        );
      }

      window.addEventListener('online',updateOnlineState);
      window.addEventListener('offline',updateOnlineState);
      updateOnlineState();

      // ------------------------------------------------------
      // V4.3.0 install + push notification center
      // ------------------------------------------------------
      let deferredInstallPrompt=null;
      const PWA_HOST_RELEASE='V4.3.11';

      let portalContext={
        travelerId:'',
        travelerName:'',
        oneSignalAppId:'',
        pwaUrl:'',
        release:''
      };

      let notificationSetupPending=false;
      let notificationSetupComplete=false;
      let notificationSetupMessage='';

      let oneSignalInitialized=false;
      let oneSignalClient=null;
      let oneSignalInitPromise=null;

      function decodeNotificationSetupHash(){
        const hash=String(window.location.hash||'');

        if(!hash.startsWith('#notifySetup=')){
          return null;
        }

        try{
          const encoded=decodeURIComponent(
            hash.slice('#notifySetup='.length)
          );

          const json=decodeURIComponent(
            escape(
              atob(encoded)
            )
          );

          return JSON.parse(json);
        }catch(error){
          console.warn('Could not decode notification setup payload.',error);
          return null;
        }
      }

      const notificationLaunch=decodeNotificationSetupHash();

      if(notificationLaunch){
        if(notificationLaunch.travelerId){
          portalContext.travelerId=String(
            notificationLaunch.travelerId||''
          );
        }

        if(notificationLaunch.travelerName){
          portalContext.travelerName=String(
            notificationLaunch.travelerName||''
          );
        }

        if(notificationLaunch.oneSignalAppId){
          portalContext.oneSignalAppId=String(
            notificationLaunch.oneSignalAppId||''
          );
        }

        notificationSetupPending=true;

        try{
          history.replaceState(
            {},
            document.title,
            window.location.pathname
          );
        }catch(error){}
      }

      const installButton=document.getElementById('installToolButton');
      const notifyButton=document.getElementById('notifyToolButton');
      const overlay=document.getElementById('appSetupOverlay');
      const dialogBody=document.getElementById('setupDialogBody');
      const dialogActions=document.getElementById('setupDialogActions');

      function isStandalone(){
        return Boolean(
          window.matchMedia &&
          window.matchMedia('(display-mode: standalone)').matches
        ) || Boolean(navigator.standalone);
      }

      function isIOS(){
        return /iphone|ipad|ipod/i.test(navigator.userAgent||'');
      }

      function isAndroid(){
        return /android/i.test(navigator.userAgent||'');
      }

      function closeSetup(){
        overlay.classList.add('hidden');
      }

      function openSetup(){
        overlay.classList.remove('hidden');
        renderSetupDialog();
      }

      overlay.addEventListener('click',function(event){
        if(event.target===overlay) closeSetup();
      });

      window.addEventListener('beforeinstallprompt',function(event){
        event.preventDefault();
        deferredInstallPrompt=event;
        installButton.textContent='📲 Install App';
      });

      window.addEventListener('appinstalled',function(){
        deferredInstallPrompt=null;
        installButton.textContent='✓ App Installed';
        renderSetupDialog();
      });

      async function promptInstall(){
        if(deferredInstallPrompt){
          deferredInstallPrompt.prompt();
          try{
            await deferredInstallPrompt.userChoice;
          }catch(ignore){}
          deferredInstallPrompt=null;
          renderSetupDialog();
          return;
        }
        openSetup();
      }

      async function initOneSignal(){
        if(oneSignalInitialized && oneSignalClient){
          return true;
        }

        if(oneSignalInitPromise){
          return oneSignalInitPromise;
        }

        if(!portalContext.oneSignalAppId){
          return false;
        }

        window.OneSignalDeferred=window.OneSignalDeferred||[];

        oneSignalInitPromise=new Promise(function(resolve){
          let settled=false;

          function finish(value){
            if(settled) return;
            settled=true;
            resolve(value);
          }

          const timeout=setTimeout(function(){
            console.warn('OneSignal initialization timed out.');
            finish(false);
          },10000);

          window.OneSignalDeferred.push(async function(OneSignal){
            try{
              oneSignalClient=OneSignal;

              await OneSignal.init({
                appId:portalContext.oneSignalAppId,
                serviceWorkerPath:'Vacation-Portal/push/onesignal/OneSignalSDKWorker.js',
                serviceWorkerParam:{
                  scope:'/Vacation-Portal/push/onesignal/'
                },
                autoResubscribe:true,
                notifyButton:{enable:false}
              });

              oneSignalInitialized=true;

              if(portalContext.travelerId){
                await OneSignal.login(portalContext.travelerId);
              }

              clearTimeout(timeout);
              finish(true);
            }catch(error){
              console.warn('OneSignal initialization failed.',error);
              clearTimeout(timeout);
              oneSignalInitialized=false;
              oneSignalClient=null;
              finish(false);
            }
          });
        }).finally(function(){
          if(!oneSignalInitialized){
            oneSignalInitPromise=null;
          }
        });

        return oneSignalInitPromise;
      }

      async function syncOneSignalTraveler(){
        if(!portalContext.travelerId) return;

        const ready=await initOneSignal();
        if(!ready || !oneSignalClient) return;

        try{
          await oneSignalClient.login(portalContext.travelerId);
        }catch(error){
          console.warn('OneSignal traveler login failed.',error);
        }
      }

      async function enableNotifications(){
        if(isIOS()&&!isStandalone()){
          notificationSetupMessage=
            'On iPhone, open Vacation Portal from its Home Screen icon first.';
          openSetup();
          return;
        }

        if(!portalContext.oneSignalAppId){
          notificationSetupMessage=
            'The OneSignal App ID is not available to this app shell.';
          openSetup();
          return;
        }

        const ready=await initOneSignal();

        if(!ready || !oneSignalClient){
          notificationSetupMessage=
            'OneSignal could not initialize. Check the OneSignal Web Push site and service worker settings.';
          openSetup();
          return;
        }

        try{
          if(portalContext.travelerId){
            await oneSignalClient.login(portalContext.travelerId);
          }

          await oneSignalClient.Notifications.requestPermission();

          if(portalContext.travelerId){
            await oneSignalClient.login(portalContext.travelerId);
          }

          const permission=
            ('Notification' in window)
              ? String(Notification.permission||'default')
              : 'unsupported';

          if(permission==='granted'){
            notificationSetupComplete=true;
            notificationSetupPending=false;
            notificationSetupMessage=
              'Notifications are enabled for '+
              (portalContext.travelerName||'this traveler')+'.';
          }else{
            notificationSetupMessage=
              permission==='denied'
                ? 'Notifications are blocked for Vacation Portal on this device.'
                : 'Notification permission was not granted.';
          }

          renderSetupDialog();
        }catch(error){
          console.warn('Notification permission failed.',error);
          notificationSetupMessage=String(
            error&&error.message
              ? error.message
              : 'Notifications could not be enabled.'
          );
          renderSetupDialog();
        }
      }

      function postToWindowSafe(target,payload){
        try{
          if(target && typeof target.postMessage==='function'){
            target.postMessage(payload,'*');
          }
        }catch(error){}
      }

      function broadcastToDescendantFrames(payload){
        const frames=document.querySelectorAll('iframe');

        frames.forEach(function(frame){
          try{
            postToWindowSafe(frame.contentWindow,payload);
          }catch(error){}
        });
      }

      function announcePwaHostReady(){
        const payload={
          type:'vacation-portal-host-ready',
          hostRelease:PWA_HOST_RELEASE
        };

        broadcastToDescendantFrames(payload);
      }

      function portalFrameWindow(){
        const frame=document.getElementById('portalFrame');
        return frame ? frame.contentWindow : null;
      }

      function sendNotificationAckToPortal(){
        broadcastToDescendantFrames({
          type:'vacation-portal-notification-ack',
          hostRelease:PWA_HOST_RELEASE
        });
      }

      function sendNotificationResultToPortal(result){
        const payload=Object.assign({
          type:'vacation-portal-notification-result',
          travelerName:portalContext.travelerName||'',
          hostRelease:PWA_HOST_RELEASE
        },result||{});

        broadcastToDescendantFrames(payload);
      }

      async function currentNotificationStatus(){
        const permission=
          ('Notification' in window)
            ? String(Notification.permission||'default')
            : 'unsupported';

        const result={
          enabled:permission==='granted',
          permission:permission
        };

        if(isIOS()&&!isStandalone()){
          result.enabled=false;
          result.message='Open Vacation Portal from its Home Screen icon before enabling notifications.';
          result.help='On iPhone/iPad, Web Push is available to installed Home Screen web apps.';
        }else if(!portalContext.oneSignalAppId){
          result.enabled=false;
          result.message='OneSignal is not configured for this trip.';
        }else if(permission==='granted'){
          result.message='Notifications enabled on this device.';
          result.help='This device is linked to '+(portalContext.travelerName||'the selected traveler')+'.';
        }else if(permission==='denied'){
          result.message='Notifications are blocked on this device.';
          result.help='Allow notifications for Vacation Portal in your device settings.';
        }else if(permission==='unsupported'){
          result.message='This browser does not support push notifications.';
        }else{
          result.message='Notifications are not enabled on this device.';
        }

        return result;
      }

      async function enableNotificationsFromPortalCommand(data){
        if(data&&data.travelerId){
          portalContext.travelerId=String(data.travelerId||'');
        }
        if(data&&data.travelerName){
          portalContext.travelerName=String(data.travelerName||'');
        }
        if(data&&data.oneSignalAppId){
          portalContext.oneSignalAppId=String(data.oneSignalAppId||'');
        }

        if(isIOS()&&!isStandalone()){
          sendNotificationResultToPortal({
            enabled:false,
            message:'Open Vacation Portal from its iPhone Home Screen icon before enabling notifications.',
            help:'Safari cannot register this subscription until the PWA is running in Home Screen app mode.',
            toastMessage:'Open the Home Screen app, then try Enable Notifications again.'
          });
          openSetup();
          return;
        }

        const ready=await initOneSignal();

        if(!ready){
          sendNotificationResultToPortal({
            enabled:false,
            message:'OneSignal could not initialize from the GitHub PWA host.',
            toastMessage:'OneSignal could not initialize.'
          });
          return;
        }

        try{
          if(!oneSignalClient){
            throw new Error('OneSignal client is unavailable after initialization.');
          }

          if(portalContext.travelerId){
            await oneSignalClient.login(portalContext.travelerId);
          }

          await oneSignalClient.Notifications.requestPermission();

          if(portalContext.travelerId){
            await oneSignalClient.login(portalContext.travelerId);
          }

          const permission=
            ('Notification' in window)
              ? String(Notification.permission||'default')
              : 'unsupported';

          const enabled=permission==='granted';

          sendNotificationResultToPortal({
            enabled:enabled,
            permission:permission,
            message:
              enabled
                ? 'Notifications enabled on this device.'
                : permission==='denied'
                  ? 'Notifications are blocked on this device.'
                  : 'Notification permission was not granted.',
            help:
              enabled
                ? 'This device is linked to '+(portalContext.travelerName||'the selected traveler')+'.'
                : '',
            toastMessage:
              enabled
                ? 'Notifications enabled for '+(portalContext.travelerName||'this traveler')+'.'
                : 'Notification permission was not granted.'
          });

          renderSetupDialog();
        }catch(error){
          console.warn('Notification permission failed.',error);

          sendNotificationResultToPortal({
            enabled:false,
            message:String(
              error&&error.message
                ? error.message
                : 'Notifications could not be enabled.'
            ),
            toastMessage:'Notifications could not be enabled.'
          });
        }
      }

      function renderSetupDialog(){
        const installed=isStandalone();

        if(notificationSetupComplete){
          dialogBody.innerHTML=`
            <p>
              <strong>Notifications are enabled.</strong>
            </p>
            <div class="setup-status">
              ${notificationSetupMessage}
            </div>
            <p>
              This device is now registered to
              <strong>${(portalContext.travelerName||'the selected traveler')
                .replace(/[&<>"']/g,function(c){
                  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
                })}</strong>.
            </p>`;

          dialogActions.innerHTML=`
            <button class="primary" type="button" id="dialogDoneButton">
              Return to Vacation Portal
            </button>`;

          document.getElementById('dialogDoneButton').onclick=function(){
            closeSetup();
          };

          return;
        }

        if(notificationSetupPending && installed){
          dialogBody.innerHTML=`
            <p class="eyebrow">NOTIFICATIONS</p>
            <h2>Enable trip notifications</h2>
            <p>
              Register this device to
              <strong>${(portalContext.travelerName||'the selected traveler')
                .replace(/[&<>"']/g,function(c){
                  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
                })}</strong>.
            </p>
            <div class="setup-status">
              ${
                notificationSetupMessage
                  ? notificationSetupMessage
                  : 'Tap the button below so iOS can request notification permission directly from the installed Vacation Portal app.'
              }
            </div>`;

          dialogActions.innerHTML=`
            <button class="primary" type="button" id="dialogNotifyDirectButton">
              Enable Notifications
            </button>
            <button type="button" id="dialogCancelNotifyButton">
              Cancel
            </button>`;

          document.getElementById('dialogNotifyDirectButton').onclick=
            enableNotifications;

          document.getElementById('dialogCancelNotifyButton').onclick=
            closeSetup;

          return;
        }

        if(isIOS()&&!installed){
          dialogBody.innerHTML=`
            <p>
              iPhone and iPad require the portal to be added to the Home Screen
              before notifications can be enabled.
            </p>
            <ol class="setup-steps">
              <li><span>Tap the <strong>Share</strong> button in your browser.</span></li>
              <li><span>Choose <strong>Add to Home Screen</strong>.</span></li>
              <li><span>Tap <strong>Add</strong>, then open <strong>Family Vacation</strong> from the new Home Screen icon.</span></li>
              <li><span>Tap <strong>Enable Notifications</strong> when the app opens.</span></li>
            </ol>
            <div class="setup-status">
              Apple does not allow a website to press “Add to Home Screen” for you,
              so these few taps are the only manual part.
            </div>`;
          dialogActions.innerHTML=`
            <button type="button" onclick="document.getElementById('appSetupOverlay').classList.add('hidden')">
              Got it
            </button>`;
          return;
        }

        if(!installed && deferredInstallPrompt){
          dialogBody.innerHTML=`
            <p>
              This device supports one-tap installation. Installing gives the portal
              its own icon and app-style window.
            </p>
            <div class="setup-status">
              After installation, enable notifications so trip updates can reach you
              even when the portal is closed.
            </div>`;
          dialogActions.innerHTML=`
            <button class="primary" type="button" id="dialogInstallButton">
              Install Vacation Portal
            </button>
            <button type="button" id="dialogCloseButton">Not now</button>`;
          document.getElementById('dialogInstallButton').onclick=promptInstall;
          document.getElementById('dialogCloseButton').onclick=closeSetup;
          return;
        }

        if(!installed){
          dialogBody.innerHTML=`
            <p>
              Use your browser's <strong>Install app</strong> or
              <strong>Add to Home screen</strong> option to add the Vacation Portal.
            </p>
            <ol class="setup-steps">
              <li><span>Open the browser menu.</span></li>
              <li><span>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</span></li>
              <li><span>Confirm the installation.</span></li>
            </ol>`;
          dialogActions.innerHTML=`
            <button type="button" id="dialogCloseButton">Done</button>`;
          document.getElementById('dialogCloseButton').onclick=closeSetup;
          return;
        }

        if(!portalContext.oneSignalAppId){
          dialogBody.innerHTML=`
            <p>The app is installed on this device.</p>
            <div class="setup-status">
              Push notifications are not configured by the trip administrator yet.
            </div>`;
          dialogActions.innerHTML=`
            <button type="button" id="dialogCloseButton">Done</button>`;
          document.getElementById('dialogCloseButton').onclick=closeSetup;
          return;
        }

        dialogBody.innerHTML=`
          <p>
            The Vacation Portal is installed. Turn on notifications for voting,
            room assignments, itinerary changes, and family announcements.
          </p>
          <div class="setup-status">
            Notifications will be linked to
            <strong>${(portalContext.travelerName||'your selected traveler')
              .replace(/[&<>"']/g,function(c){
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
              })}</strong>.
          </div>`;
        dialogActions.innerHTML=`
          <button class="primary" type="button" id="dialogNotifyButton">
            Enable Notifications on This Device
          </button>
          <button type="button" id="dialogCloseButton">Not now</button>`;
        document.getElementById('dialogNotifyButton').onclick=enableNotifications;
        document.getElementById('dialogCloseButton').onclick=closeSetup;
      }

      installButton.addEventListener('click',promptInstall);
      notifyButton.addEventListener('click',function(){
        notificationSetupPending=true;
        notificationSetupMessage='Tap Enable Notifications below to allow trip alerts on this device.';
        openSetup();
      });

      window.addEventListener('message',function(event){
        const data=event.data||{};

        if(
          !data ||
          typeof data.type!=='string' ||
          data.type.indexOf('vacation-portal-')!==0
        ){
          return;
        }

        if(data.type==='vacation-portal-handshake-request'){
          broadcastToDescendantFrames({
            type:'vacation-portal-handshake-response',
            hostRelease:PWA_HOST_RELEASE
          });
          return;
        }

        if(data.type==='vacation-portal-context'){
          portalContext={
            travelerId:String(data.travelerId||''),
            travelerName:String(data.travelerName||''),
            oneSignalAppId:String(data.oneSignalAppId||''),
            pwaUrl:String(data.pwaUrl||''),
            release:String(data.release||'')
          };

          syncOneSignalTraveler();
          return;
        }

        if(data.type==='vacation-portal-open-app-setup'){
          openSetup();
          return;
        }

        if(data.type==='vacation-portal-enable-notifications'){
          sendNotificationAckToPortal();

          if(
            data.requiredHostRelease &&
            String(data.requiredHostRelease)!==PWA_HOST_RELEASE
          ){
            sendNotificationResultToPortal({
              enabled:false,
              message:
                'Installed PWA host version mismatch. Expected '+
                String(data.requiredHostRelease)+
                ' but this shell is '+PWA_HOST_RELEASE+'.',
              toastMessage:'Update/reopen the installed Vacation Portal app.'
            });
            return;
          }

          enableNotificationsFromPortalCommand(data);
          return;
        }

        if(data.type==='vacation-portal-notification-status'){
          sendNotificationAckToPortal();

          if(data.travelerId){
            portalContext.travelerId=String(data.travelerId||'');
          }
          if(data.travelerName){
            portalContext.travelerName=String(data.travelerName||'');
          }
          if(data.oneSignalAppId){
            portalContext.oneSignalAppId=String(data.oneSignalAppId||'');
          }

          currentNotificationStatus().then(function(result){
            sendNotificationResultToPortal(result);
          });
        }
      });

      if(isStandalone()){
        installButton.textContent='✓ App Installed';
      }else if(isIOS()){
        installButton.textContent='📲 Add to Home';
      }

      if(notificationSetupPending){
        document.body.classList.add('notification-setup-launch');

        setTimeout(function(){
          openSetup();

          const setupTitle=document.getElementById('setupTitle');
          if(setupTitle){
            setupTitle.textContent='Enable notifications';
          }
        },350);
      }

      [300,1000,2500,5000,9000].forEach(function(delay){
        setTimeout(announcePwaHostReady,delay);
      });

      // Gentle first-run onboarding. Do not repeatedly nag the traveler.
      const onboardingKey='vacationPortalAppSetupShownV430';
      if(!isStandalone()&&!localStorage.getItem(onboardingKey)){
        setTimeout(function(){
          localStorage.setItem(onboardingKey,'1');
          openSetup();
        },1800);
      }
    })();
  </script>
</body>
</html>
